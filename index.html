function initNetworkCanvas(canvas){
  const ctx = canvas.getContext('2d');
  let w,h,nodes,raf;
  function resize(){
    const rect = canvas.parentElement.getBoundingClientRect();
    w = canvas.width = rect.width * devicePixelRatio;
    h = canvas.height = rect.height * devicePixelRatio;
    canvas.style.width = rect.width+'px';
    canvas.style.height = rect.height+'px';
  }
  function makeNodes(){
    const count = Math.max(24, Math.floor((w*h) / (55000 * devicePixelRatio * devicePixelRatio)));
    nodes = Array.from({length: count}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.15*devicePixelRatio, vy: (Math.random()-0.5)*0.15*devicePixelRatio,
      accent: Math.random() < 0.08
    }));
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    const maxDist = 150 * devicePixelRatio;
    for(let i=0;i<nodes.length;i++){
      const n = nodes[i];
      if(!REDUCED_MOTION){ n.x += n.vx; n.y += n.vy; }
      if(n.x < 0 || n.x > w) n.vx *= -1;
      if(n.y < 0 || n.y > h) n.vy *= -1;
      for(let j=i+1;j<nodes.length;j++){
        const o = nodes[j];
        const dx = n.x-o.x, dy = n.y-o.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < maxDist){
          ctx.strokeStyle = `rgba(140,138,130,${(1-dist/maxDist)*0.18})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(o.x,o.y); ctx.stroke();
        }
      }
    }
    for(const n of nodes){
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.accent ? 2.4*devicePixelRatio : 1.6*devicePixelRatio, 0, Math.PI*2);
      ctx.fillStyle = n.accent ? 'rgba(144,12,32,.85)' : 'rgba(230,225,215,0.45)';
      ctx.fill();
    }
    if(!REDUCED_MOTION) raf = requestAnimationFrame(draw);
  }
  resize(); makeNodes(); draw();
  window.addEventListener('resize', () => { cancelAnimationFrame(raf); resize(); makeNodes(); draw(); }, { once:false });
}
function initAsciiCanvas(canvas){
  const ctx = canvas.getContext('2d');
  const chars = [' ','.',':','+','=','-','#'];
  let cols=0, rows=0, cellW=0, cellH=0, w=0, h=0, phase=0, timer=null, raf=0;

  function resize(){
    const rect = canvas.parentElement.getBoundingClientRect();
    w = Math.max(1, Math.floor(rect.width * devicePixelRatio));
    h = Math.max(1, Math.floor(rect.height * devicePixelRatio));
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    cellW = 8 * devicePixelRatio;
    cellH = 15 * devicePixelRatio;
    cols = Math.max(1, Math.floor(w / cellW));
    rows = Math.max(1, Math.floor(h / cellH));
  }

  function noise(x,y,t){
    return (
      Math.sin(x*0.17 + t) +
      Math.sin(y*0.43 - t*1.2) +
      Math.sin((x+y)*0.055 + t*0.7)
    ) / 3;
  }

  function bShape(x,y){
    const bx = cols * 0.50;
    const by = rows * 0.49;
    const sx = cols * 0.17;
    const sy = Math.max(4, rows * 0.40);
    const nx = (x-bx)/sx;
    const ny = (y-by)/sy;
    const vertical = Math.abs(nx + 0.48) < 0.16 && Math.abs(ny) < 1;
    const upper = Math.pow(nx-0.05,2) + Math.pow(ny+0.48,2) < 0.38;
    const middle = Math.pow(nx-0.08,2) + Math.pow(ny,2) < 0.34;
    const lower = Math.pow(nx-0.02,2) + Math.pow(ny-0.48,2) < 0.38;
    const cut1 = Math.pow(nx+0.12,2) + Math.pow(ny+0.47,2) < 0.13;
    const cut2 = Math.pow(nx+0.12,2) + Math.pow(ny-0.47,2) < 0.13;
    return (vertical || upper || middle || lower) && !cut1 && !cut2;
  }

  function draw(){
    ctx.clearRect(0,0,w,h);
    ctx.font = `${10.5*devicePixelRatio}px 'JetBrains Mono', monospace`;
    ctx.textBaseline = 'top';

    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        const edge = Math.min(y, rows-1-y);
        const ambient = Math.max(0, 0.34 - edge*0.008);
        const stream = noise(x,y,phase*0.9);
        const b = bShape(x,y);
        let density = ambient + (stream+1)*0.06 + (b ? 0.78 : 0);

        if(y > rows*0.80){
          density = 0.20 + ((Math.sin(x*0.45 + phase)+1)*0.08) + (stream+1)*0.03;
        }

        if(density < 0.23) continue;
        const level = Math.max(1, Math.min(chars.length-1, Math.floor(density*chars.length)));
        const ch = chars[level];
        const flicker = Math.sin(x*0.9 + y*0.7 + phase*3.4);
        const accent = (b && flicker > 0.92) || (!b && flicker > 0.995);

        ctx.fillStyle = accent
          ? 'rgba(144,12,32,.78)'
          : `rgba(220,215,205,${b ? 0.28 + level*0.10 : 0.08 + level*0.07})`;
        ctx.fillText(ch, x*cellW, y*cellH);
      }
    }

    if(!REDUCED_MOTION){
      phase += 0.018;
      raf = requestAnimationFrame(draw);
    }
  }

  resize();
  cancelAnimationFrame(raf);
  draw();

  clearInterval(timer);
  if(!REDUCED_MOTION){
    timer = setInterval(() => { phase += 0.22; }, 700);
  }

  window.addEventListener('resize', () => {
    cancelAnimationFrame(raf);
    resize();
    draw();
  });
}

function initChallengeGame(){
  const root = document.getElementById('challenge');
  if(!root || root.dataset.ready) return;
  root.dataset.ready = '1';

  const scenarios = [
    { prompt:'A wallet extension asks you to paste your recovery phrase into a website to "verify" your account.', answer:'safe', safe:'Correct. Never enter a recovery phrase into a website.', unsafe:'That is a red flag. Recovery phrases should stay offline and private.' },
    { prompt:'A project repository asks you to run a random shell command copied from an issue comment before reviewing it.', answer:'safe', safe:'Correct. Review commands before executing them, especially from untrusted sources.', unsafe:'Pause first. Treat unknown commands as untrusted code.' },
    { prompt:'A login page uses the exact domain you expected, HTTPS, and your usual password manager recognizes it.', answer:'unsafe', safe:'Still verify the destination before entering credentials.', unsafe:'Good. The signals are consistent, but verification is still the safer habit.' }
  ];

  let index=0, score=0, time=20, interval=null, locked=false;
  const promptEl=root.querySelector('#challenge-prompt');
  const progressEl=root.querySelector('#challenge-progress');
  const timerEl=root.querySelector('#challenge-timer');
  const scoreEl=root.querySelector('#challenge-score');
  const feedbackEl=root.querySelector('#challenge-feedback');
  const buttons=[...root.querySelectorAll('.challenge-choice')];

  function render(){
    const s=scenarios[index];
    promptEl.textContent=s.prompt;
    progressEl.textContent=`SCENARIO ${String(index+1).padStart(2,'0')}`;
    scoreEl.textContent=String(score).padStart(2,'0');
    feedbackEl.textContent='';
    buttons.forEach(b=>b.disabled=false);
    locked=false;
    time=20;
    timerEl.textContent='20s';
  }

  function finish(){
    clearInterval(interval);
    buttons.forEach(b=>b.disabled=true);
    feedbackEl.textContent=`CHALLENGE COMPLETE // SCORE ${String(score).padStart(2,'0')} / 03`;
    timerEl.textContent='DONE';
  }

  function startTimer(){
    clearInterval(interval);
    interval=setInterval(()=>{
      time--;
      timerEl.textContent=`${time}s`;
      if(time<=0){
        clearInterval(interval);
        if(!locked){
          locked=true;
          feedbackEl.textContent='TIMEOUT // REVIEW THE SIGNAL BEFORE ACTING';
          buttons.forEach(b=>b.disabled=true);
          setTimeout(()=>{
            index++;
            if(index>=scenarios.length) finish();
            else { render(); startTimer(); }
          },900);
        }
      }
    },1000);
  }

  buttons.forEach(btn=>btn.addEventListener('click',()=>{
    if(locked) return;
    locked=true;
    const correct=btn.dataset.answer===scenarios[index].answer;
    if(correct) score++;
    scoreEl.textContent=String(score).padStart(2,'0');
    feedbackEl.textContent=correct ? scenarios[index].safe : scenarios[index].unsafe;
    buttons.forEach(b=>b.disabled=true);
    clearInterval(interval);
    setTimeout(()=>{
      index++;
      if(index>=scenarios.length) finish();
      else { render(); startTimer(); }
    },1000);
  }));

  render();
  startTimer();
}

</script>
<script>
(function(){
  const loader = document.getElementById('security-loader');
  if(!loader) return;

  const fill = document.getElementById('security-loader-fill');
  const status = document.getElementById('security-loader-status');

  const messages = [
    'Initializing secure system',
    'Loading cryptographic modules',
    'Verifying system integrity',
    'Initializing blockchain network',
    'Activating security protocols',
    'Access granted'
  ];

  const duration = 3000;
  const start = performance.now();

  function update(now){
    const elapsed = now - start;
    const progress = Math.min(100, Math.round((elapsed / duration) * 100));
    fill.style.width = progress + '%';
    const index = Math.min(messages.length - 1, Math.floor(progress / 20));
    status.textContent = messages[index];

    if(progress < 100){
      requestAnimationFrame(update);
    }else{
      setTimeout(() => {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 850);
      }, 450);
    }
  }

  requestAnimationFrame(update);
})();
</script>

<script id="final-ripple-fix">
(function(){
  function triggerRipple(button, event){
    if(!button || button.dataset.rippleBound === '1') return;
    button.dataset.rippleBound = '1';

    button.addEventListener('pointerenter', function(e){
      const rect = button.getBoundingClientRect();
      button.style.setProperty('--ripple-x', (e.clientX - rect.left) + 'px');
      button.style.setProperty('--ripple-y', (e.clientY - rect.top) + 'px');
      button.classList.remove('ripple-active');
      void button.offsetWidth;
      button.classList.add('ripple-active');
    });

    button.addEventListener('animationend', function(e){
      if(e.animationName === 'selectedButtonRipple'){
        button.classList.remove('ripple-active');
      }
    });
  }

  function bind(){
    document.querySelectorAll('.btn-primary, .labs-action, .ripple-button')
      .forEach(triggerRipple);
  }

  document.addEventListener('DOMContentLoaded', bind);
  new MutationObserver(bind).observe(document.body,{childList:true,subtree:true});
})();
</script>





<script id="connect-faculty-filter">
(function(){
  function applyFacultyFilter(category){
    const tabs=document.querySelectorAll('[data-faculty-filter]');
    const cards=document.querySelectorAll('.faculty-card');

    tabs.forEach(tab=>{
      const active=tab.dataset.facultyFilter===category;
      tab.classList.toggle('active',active);
      tab.setAttribute('aria-selected',active?'true':'false');
    });

    cards.forEach(card=>{
      const show=category==='all' || card.dataset.facultyCategory===category;
      card.hidden=!show;
      card.style.display=show?'':'none';
    });
  }

  /* Event delegation makes the filter work even when Connect is
     rendered dynamically after navigation. */
  document.addEventListener('click',function(e){
    const tab=e.target.closest('[data-faculty-filter]');
    if(!tab) return;

    e.preventDefault();
    applyFacultyFilter(tab.dataset.facultyFilter);
  });

  function initFacultyFilter(){
    const tabs=document.querySelectorAll('[data-faculty-filter]');
    if(!tabs.length) return;

    const active=[...tabs].find(t=>t.dataset.facultyFilter==='all')||tabs[0];
    applyFacultyFilter(active.dataset.facultyFilter);
  }

  document.addEventListener('DOMContentLoaded',initFacultyFilter);

  new MutationObserver(function(){
    const tabs=document.querySelectorAll('[data-faculty-filter]');
    if(!tabs.length) return;
    const active=[...tabs].find(t=>t.getAttribute('aria-selected')==='true')
      || [...tabs].find(t=>t.classList.contains('active'))
      || [...tabs].find(t=>t.dataset.facultyFilter==='all')
      || tabs[0];
    applyFacultyFilter(active.dataset.facultyFilter);
  }).observe(document.body,{childList:true,subtree:true});
})();
</script>














<script id="connect-local-nav-js">
(function(){
  function setupConnectNav(){
    const nav = document.querySelector('.connect-local-links');
    const root = document.querySelector('#connect-all');
    if(!nav || !root) return;

    const buttons = nav.querySelectorAll('[data-connect-view]');

    function setView(view, scroll){
      if(!['all','team','faculty'].includes(view)) view = 'all';

      root.classList.remove(
        'connect-view-all',
        'connect-view-team',
        'connect-view-faculty'
      );
      root.classList.add('connect-view-' + view);

      buttons.forEach(btn => {
        const active = btn.dataset.connectView === view;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });

      if(scroll){
        let target = root;
        if(view === 'team'){
          target = document.getElementById('connect-team') || root;
        }else if(view === 'faculty'){
          target = document.getElementById('connect-faculty') || root;
        }
        target.scrollIntoView({behavior:'smooth', block:'start'});
      }
    }

    buttons.forEach(btn => {
      if(btn.dataset.connectBound === '1') return;
      btn.dataset.connectBound = '1';

      btn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        if(e.stopImmediatePropagation) e.stopImmediatePropagation();
        setView(this.dataset.connectView, true);
      }, true);
    });

    setView('all', false);
  }

  function watch(){
    setupConnectNav();
    new MutationObserver(() => setupConnectNav())
      .observe(document.body, {childList:true, subtree:true});
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', watch);
  }else{
    watch();
  }
})();
</script>

    const app=document.getElementById('app');
    if(!app) return;
    new MutationObserver(addFooter).observe(app,{childList:true,subtree:true});
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>


<script id="join-member-transition-handler">
document.addEventListener('click', function(e){
  const join = e.target.closest('[data-join-member]');
  if(!join) return;
  sessionStorage.setItem('joinMemberTransition','1');
});
</script>


<script id="membership-scroll-handler">
(function(){
  function scrollToMembership(instant){
    const form = document.querySelector('[data-membership-form]');
    if(!form) return false;

    requestAnimationFrame(function(){
      form.scrollIntoView({
        behavior: instant ? 'auto' : 'smooth',
        block: 'start'
      });
    });
    return true;
  }

  document.addEventListener('click', function(e){
    const join = e.target.closest('[data-join-member]');
    if(!join) return;

    // Tell the Contact route to open directly at the membership form.
    sessionStorage.setItem('openMembershipOnContact','1');
    sessionStorage.setItem('joinMemberTransition','1');

    // If already on Contact, don't reload/re-route; just jump to the form.
    if(window.location.hash === '#/contact'){
      e.preventDefault();
      scrollToMembership(false);
    }
  });

  // The app router renders the Contact page on hashchange. Once the form
  // exists in the DOM, immediately position the page at the form.
  window.addEventListener('hashchange', function(){
    if(window.location.hash === '#/contact' &&
       sessionStorage.getItem('openMembershipOnContact') === '1'){
      let tries = 0;
      const waitForForm = setInterval(function(){
        tries++;
        if(scrollToMembership(true) || tries >= 30){
          clearInterval(waitForForm);
          sessionStorage.removeItem('openMembershipOnContact');
        }
      }, 25);
    }
  });

  // Also handle a fresh page load with the flag still set.
  if(window.location.hash === '#/contact' &&
     sessionStorage.getItem('openMembershipOnContact') === '1'){
    let tries = 0;
    const waitForForm = setInterval(function(){
      tries++;
      if(scrollToMembership(true) || tries >= 30){
        clearInterval(waitForForm);
        sessionStorage.removeItem('openMembershipOnContact');
      }
    }, 25);
  }
})();
</script>

</body>
</html>
