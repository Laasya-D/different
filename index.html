function initNetworkCanvas(canvas){
  const ctx = canvas.getContext('2d');
  let w,h,nodes,raf;
  function resize(){
    const rect = canvas.parentElement.getBoundingClientRect();
    w = canvas.width = rect.width * devicePixelRatio;
    h = canvas.height = rect.height * devicePixelRatio;
    canvas.style.width = rect.width+'px';
    canvas.style.height = rect.height+'px';
  }
  function makeNodes(){
    const count = Math.max(24, Math.floor((w*h) / (55000 * devicePixelRatio * devicePixelRatio)));
    nodes = Array.from({length: count}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.15*devicePixelRatio, vy: (Math.random()-0.5)*0.15*devicePixelRatio,
      accent: Math.random() < 0.08
    }));
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    const maxDist = 150 * devicePixelRatio;
    for(let i=0;i<nodes.length;i++){
      const n = nodes[i];
      if(!REDUCED_MOTION){ n.x += n.vx; n.y += n.vy; }
      if(n.x < 0 || n.x > w) n.vx *= -1;
      if(n.y < 0 || n.y > h) n.vy *= -1;
      for(let j=i+1;j<nodes.length;j++){
        const o = nodes[j];
        const dx = n.x-o.x, dy = n.y-o.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < maxDist){
          ctx.strokeStyle = `rgba(140,138,130,${(1-dist/maxDist)*0.18})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(o.x,o.y); ctx.stroke();
        }
      }
    }
    for(const n of nodes){
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.accent ? 2.4*devicePixelRatio : 1.6*devicePixelRatio, 0, Math.PI*2);
      ctx.fillStyle = n.accent ? 'rgba(144,12,32,.85)' : 'rgba(230,225,215,0.45)';
      ctx.fill();
    }
    if(!REDUCED_MOTION) raf = requestAnimationFrame(draw);
  }
  resize(); makeNodes(); draw();
  window.addEventListener('resize', () => { cancelAnimationFrame(raf); resize(); makeNodes(); draw(); }, { once:false });
}
function initAsciiCanvas(canvas){
  const ctx = canvas.getContext('2d');
  const chars = [' ','.',':','+','=','-','#'];
  let cols=0, rows=0, cellW=0, cellH=0, w=0, h=0, phase=0, timer=null, raf=0;

  function resize(){
    const rect = canvas.parentElement.getBoundingClientRect();
    w = Math.max(1, Math.floor(rect.width * devicePixelRatio));
    h = Math.max(1, Math.floor(rect.height * devicePixelRatio));
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    cellW = 8 * devicePixelRatio;
    cellH = 15 * devicePixelRatio;
    cols = Math.max(1, Math.floor(w / cellW));
    rows = Math.max(1, Math.floor(h / cellH));
  }

  function noise(x,y,t){
    return (
      Math.sin(x*0.17 + t) +
      Math.sin(y*0.43 - t*1.2) +
      Math.sin((x+y)*0.055 + t*0.7)
    ) / 3;
  }

  function bShape(x,y){
    const bx = cols * 0.50;
    const by = rows * 0.49;
    const sx = cols * 0.17;
    const sy = Math.max(4, rows * 0.40);
    const nx = (x-bx)/sx;
    const ny = (y-by)/sy;
    const vertical = Math.abs(nx + 0.48) < 0.16 && Math.abs(ny) < 1;
    const upper = Math.pow(nx-0.05,2) + Math.pow(ny+0.48,2) < 0.38;
    const middle = Math.pow(nx-0.08,2) + Math.pow(ny,2) < 0.34;
    const lower = Math.pow(nx-0.02,2) + Math.pow(ny-0.48,2) < 0.38;
    const cut1 = Math.pow(nx+0.12,2) + Math.pow(ny+0.47,2) < 0.13;
    const cut2 = Math.pow(nx+0.12,2) + Math.pow(ny-0.47,2) < 0.13;
    return (vertical || upper || middle || lower) && !cut1 && !cut2;
  }

  function draw(){
    ctx.clearRect(0,0,w,h);
    ctx.font = `${10.5*devicePixelRatio}px 'JetBrains Mono', monospace`;
    ctx.textBaseline = 'top';

    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        const edge = Math.min(y, rows-1-y);
        const ambient = Math.max(0, 0.34 - edge*0.008);
        const stream = noise(x,y,phase*0.9);
        const b = bShape(x,y);
        let density = ambient + (stream+1)*0.06 + (b ? 0.78 : 0);

        if(y > rows*0.80){
          density = 0.20 + ((Math.sin(x*0.45 + phase)+1)*0.08) + (stream+1)*0.03;
        }

        if(density < 0.23) continue;
        const level = Math.max(1, Math.min(chars.length-1, Math.floor(density*chars.length)));
        const ch = chars[level];
        const flicker = Math.sin(x*0.9 + y*0.7 + phase*3.4);
        const accent = (b && flicker > 0.92) || (!b && flicker > 0.995);

        ctx.fillStyle = accent
          ? 'rgba(144,12,32,.78)'
          : `rgba(220,215,205,${b ? 0.28 + level*0.10 : 0.08 + level*0.07})`;
        ctx.fillText(ch, x*cellW, y*cellH);
      }
    }

    if(!REDUCED_MOTION){
      phase += 0.018;
      raf = requestAnimationFrame(draw);
    }
  }

  resize();
  cancelAnimationFrame(raf);
  draw();

  clearInterval(timer);
  if(!REDUCED_MOTION){
    timer = setInterval(() => { phase += 0.22; }, 700);
  }

  window.addEventListener('resize', () => {
    cancelAnimationFrame(raf);
    resize();
    draw();
  });
}

function initChallengeGame(){
  const root = document.getElementById('challenge');
  if(!root || root.dataset.ready) return;
  root.dataset.ready = '1';

  const scenarios = [
    { prompt:'A wallet extension asks you to paste your recovery phrase into a website to "verify" your account.', answer:'safe', safe:'Correct. Never enter a recovery phrase into a website.', unsafe:'That is a red flag. Recovery phrases should stay offline and private.' },
    { prompt:'A project repository asks you to run a random shell command copied from an issue comment before reviewing it.', answer:'safe', safe:'Correct. Review commands before executing them, especially from untrusted sources.', unsafe:'Pause first. Treat unknown commands as untrusted code.' },
    { prompt:'A login page uses the exact domain you expected, HTTPS, and your usual password manager recognizes it.', answer:'unsafe', safe:'Still verify the destination before entering credentials.', unsafe:'Good. The signals are consistent, but verification is still the safer habit.' }
  ];

  let index=0, score=0, time=20, interval=null, locked=false;
  const promptEl=root.querySelector('#challenge-prompt');
  const progressEl=root.querySelector('#challenge-progress');
  const timerEl=root.querySelector('#challenge-timer');
  const scoreEl=root.querySelector('#challenge-score');
  const feedbackEl=root.querySelector('#challenge-feedback');
  const buttons=[...root.querySelectorAll('.challenge-choice')];

  function render(){
    const s=scenarios[index];
    promptEl.textContent=s.prompt;
    progressEl.textContent=`SCENARIO ${String(index+1).padStart(2,'0')}`;
    scoreEl.textContent=String(score).padStart(2,'0');
    feedbackEl.textContent='';
    buttons.forEach(b=>b.disabled=false);
    locked=false;
    time=20;
    timerEl.textContent='20s';
  }

  function finish(){
    clearInterval(interval);
    buttons.forEach(b=>b.disabled=true);
    feedbackEl.textContent=`CHALLENGE COMPLETE // SCORE ${String(score).padStart(2,'0')} / 03`;
    timerEl.textContent='DONE';
  }

  function startTimer(){
    clearInterval(interval);
    interval=setInterval(()=>{
      time--;
      timerEl.textContent=`${time}s`;
      if(time<=0){
        clearInterval(interval);
        if(!locked){
          locked=true;
          feedbackEl.textContent='TIMEOUT // REVIEW THE SIGNAL BEFORE ACTING';
          buttons.forEach(b=>b.disabled=true);
          setTimeout(()=>{
            index++;
            if(index>=scenarios.length) finish();
            else { render(); startTimer(); }
          },900);
        }
      }
    },1000);
  }

  buttons.forEach(btn=>btn.addEventListener('click',()=>{
    if(locked) return;
    locked=true;
    const correct=btn.dataset.answer===scenarios[index].answer;
    if(correct) score++;
    scoreEl.textContent=String(score).padStart(2,'0');
    feedbackEl.textContent=correct ? scenarios[index].safe : scenarios[index].unsafe;
    buttons.forEach(b=>b.disabled=true);
    clearInterval(interval);
    setTimeout(()=>{
      index++;
      if(index>=scenarios.length) finish();
      else { render(); startTimer(); }
    },1000);
  }));

  render();
  startTimer();
}

</script>
<script>
(function(){
  const loader = document.getElementById('security-loader');
  if(!loader) return;

  const fill = document.getElementById('security-loader-fill');
  const status = document.getElementById('security-loader-status');

  const messages = [
    'Initializing secure system',
    'Loading cryptographic modules',
    'Verifying system integrity',
    'Initializing blockchain network',
    'Activating security protocols',
    'Access granted'
  ];

  const duration = 3000;
  const start = performance.now();

  function update(now){
    const elapsed = now - start;
    const progress = Math.min(100, Math.round((elapsed / duration) * 100));
    fill.style.width = progress + '%';
    const index = Math.min(messages.length - 1, Math.floor(progress / 20));
    status.textContent = messages[index];

    if(progress < 100){
      requestAnimationFrame(update);
    }else{
      setTimeout(() => {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 850);
      }, 450);
    }
  }

  requestAnimationFrame(update);
})();
</script>

<script id="final-ripple-fix">
(function(){
  function triggerRipple(button, event){
    if(!button || button.dataset.rippleBound === '1') return;
    button.dataset.rippleBound = '1';

    button.addEventListener('pointerenter', function(e){
      const rect = button.getBoundingClientRect();
      button.style.setProperty('--ripple-x', (e.clientX - rect.left) + 'px');
      button.style.setProperty('--ripple-y', (e.clientY - rect.top) + 'px');
      button.classList.remove('ripple-active');
      void button.offsetWidth;
      button.classList.add('ripple-active');
    });

    button.addEventListener('animationend', function(e){
      if(e.animationName === 'selectedButtonRipple'){
        button.classList.remove('ripple-active');
      }
    });
  }

  function bind(){
    document.querySelectorAll('.btn-primary, .labs-action, .ripple-button')
      .forEach(triggerRipple);
  }

  document.addEventListener('DOMContentLoaded', bind);
  new MutationObserver(bind).observe(document.body,{childList:true,subtree:true});
})();
</script>





<script id="connect-faculty-filter">
(function(){

    const tabs=document.querySelectorAll('[data-faculty-filter]');
    const cards=document.querySelectorAll('.faculty-card');

    tabs.forEach(tab=>{
      const active=tab.dataset.facultyFilter===category;
      tab.classList.toggle('active',active);
      tab.setAttribute('aria-selected',active?'true':'false');
    });

    cards.forEach(card=>{
      const show=category==='all' || card.dataset.facultyCategory===category;
      card.hidden=!show;
      card.style.display=show?'':'none';
    });
  }

     rendered dynamically after navigation. */
  document.addEventListener('click',function(e){
    const tab=e.target.closest('[data-faculty-filter]');
    if(!tab) return;

    e.preventDefault();
    applyFacultyFilter(tab.dataset.facultyFilter);
  });

  function initFacultyFilter(){
    const tabs=document.querySelectorAll('[data-faculty-filter]');
    if(!tabs.length) return;

    const active=[...tabs].find(t=>t.dataset.facultyFilter==='all')||tabs[0];
    applyFacultyFilter(active.dataset.facultyFilter);
  }

  document.addEventListener('DOMContentLoaded',initFacultyFilter);

  new MutationObserver(function(){
    const tabs=document.querySelectorAll('[data-faculty-filter]');
    if(!tabs.length) return;
    const active=[...tabs].find(t=>t.getAttribute('aria-selected')==='true')
      || [...tabs].find(t=>t.classList.contains('active'))
      || [...tabs].find(t=>t.dataset.facultyFilter==='all')
      || tabs[0];
    applyFacultyFilter(active.dataset.facultyFilter);
  }).observe(document.body,{childList:true,subtree:true});
})();

<script id="connect-local-nav-js">
(function(){
  function setupConnectNav(){
    const nav = document.querySelector('.connect-local-links');
    const root = document.querySelector('#connect-all');
    if(!nav || !root) return;

    const buttons = nav.querySelectorAll('[data-connect-view]');

    function setView(view, scroll){
      if(!['all','team','faculty'].includes(view)) view = 'all';

      root.classList.remove(
        'connect-view-all',
        'connect-view-team',
        'connect-view-faculty'
      );
      root.classList.add('connect-view-' + view);

      buttons.forEach(btn => {
        const active = btn.dataset.connectView === view;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });

      if(scroll){
        let target = root;
        if(view === 'team'){
          target = document.getElementById('connect-team') || root;
        }else if(view === 'faculty'){
          target = document.getElementById('connect-faculty') || root;
        }
        target.scrollIntoView({behavior:'smooth', block:'start'});
      }
    }

    buttons.forEach(btn => {
      if(btn.dataset.connectBound === '1') return;
      btn.dataset.connectBound = '1';

      btn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        if(e.stopImmediatePropagation) e.stopImmediatePropagation();
        setView(this.dataset.connectView, true);
      }, true);
    });

    setView('all', false);
  }

  function watch(){
    setupConnectNav();
    new MutationObserver(() => setupConnectNav())
      .observe(document.body, {childList:true, subtree:true});
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', watch);
  }else{
    watch();
  }
})();
</script>

<script id="membership-scroll-handler">
(function(){
  function scrollToMembership(instant){
    const form = document.querySelector('[data-membership-form]');
    if(!form) return false;

    requestAnimationFrame(function(){
      form.scrollIntoView({
        behavior: instant ? 'auto' : 'smooth',
        block: 'start'
      });
    });
    return true;
  }

  document.addEventListener('click', function(e){
    const join = e.target.closest('[data-join-member]');
    if(!join) return;

    // Tell the Contact route to open directly at the membership form.
    sessionStorage.setItem('openMembershipOnContact','1');
    sessionStorage.setItem('joinMemberTransition','1');

    // If already on Contact, don't reload/re-route; just jump to the form.
    if(window.location.hash === '#/contact'){
      e.preventDefault();
      scrollToMembership(false);
    }
  });

  // The app router renders the Contact page on hashchange. Once the form
  // exists in the DOM, immediately position the page at the form.
  window.addEventListener('hashchange', function(){
    if(window.location.hash === '#/contact' &&
       sessionStorage.getItem('openMembershipOnContact') === '1'){
      let tries = 0;
      const waitForForm = setInterval(function(){
        tries++;
        if(scrollToMembership(true) || tries >= 30){
          clearInterval(waitForForm);
          sessionStorage.removeItem('openMembershipOnContact');
        }
      }, 25);
    }
  });

  // Also handle a fresh page load with the flag still set.
  if(window.location.hash === '#/contact' &&
     sessionStorage.getItem('openMembershipOnContact') === '1'){
    let tries = 0;
    const waitForForm = setInterval(function(){
      tries++;
      if(scrollToMembership(true) || tries >= 30){
        clearInterval(waitForForm);
        sessionStorage.removeItem('openMembershipOnContact');
      }
    }, 25);
  }
})();
</script>

#quizContainer .hub-title p{color:var(--muted);font-size:18px}
#quizContainer .level-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin-top:70px}
#quizContainer .level-card{min-height:300px;padding:34px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;display:flex;flex-direction:column}
#quizContainer .level-card:nth-child(3n){border-right:0}
#quizContainer .level-card .num{font-family:"IBM Plex Mono",monospace;color:var(--red)}
#quizContainer .level-card h2{font-size:34px;margin:45px 0 10px}
#quizContainer .level-card p{color:var(--muted);line-height:1.6;margin:0}
#quizContainer .level-card .best{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-top:18px}
#quizContainer .level-card button{margin-top:auto;align-self:flex-start}
#quizContainer .level-card.locked{opacity:.38}
#quizContainer .lock{position:absolute;right:28px;top:30px;color:var(--red);font-family:"IBM Plex Mono",monospace;font-size:12px}
#quizContainer .progress{height:2px;background:var(--line);margin-top:25px}
#quizContainer .progress div{height:100%;background:var(--red);width:0;transition:.2s}
#quizContainer .question{max-width:880px;margin:110px auto}
#quizContainer .question h1{font-size:clamp(36px,5vw,66px);line-height:1.1;letter-spacing:-.045em;margin:22px 0 45px}
#quizContainer .answers{display:grid;gap:10px}
#quizContainer .answer{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:21px 24px;text-align:left;font:500 16px Inter;cursor:pointer}
#quizContainer .answer:hover{border-color:#777}
#quizContainer .answer.correct{border-color:#507a59;color:#cce8d1}
#quizContainer .answer.wrong{border-color:var(--red);color:#f0b2b6}
#quizContainer .next{margin-top:24px}
#quizContainer .result{max-width:750px;text-align:center;margin:18vh auto}
#quizContainer .result h1{font-size:clamp(60px,11vw,140px);color:var(--red);letter-spacing:-.07em;margin:15px 0}
#quizContainer .score b{font:700 clamp(75px,12vw,150px) "IBM Plex Mono";color:var(--text)}
#quizContainer .score small{font:24px "IBM Plex Mono";color:var(--muted)}
#quizContainer .result p{font-size:18px;color:var(--muted);line-height:1.7;max-width:580px;margin:24px auto 30px}
@media(max-width:800px){#quizContainer .view{padding:22px} #quizContainer .level-grid{grid-template-columns:1fr} #quizContainer .level-card{border-right:0} #quizContainer .level-card h2{margin-top:30px} #quizContainer .hub-title{margin-top:55px} #quizContainer .question{margin:75px auto} #quizContainer .ghost{margin:10px 0 0} #quizContainer .home h1{font-size:24vw}}
</style>

const subLevels=[];
difficultySets.forEach((set,difficultyIndex)=>{
  for(let i=0;i<set.qs.length;i+=9){
    const qs=set.qs.slice(i,i+9);
    subLevels.push({name:set.name,sub:i/9+1,difficulty:difficultyIndex,desc:set.desc,qs});
  }
});
let currentLevel=0,currentQ=0,score=0,answered=false;
function state(){return JSON.parse(localStorage.getItem("cyberchainSubStateV3")||'{"unlocked":1,"scores":{},"lastDay":"","streak":0}');}
function save(s){localStorage.setItem("cyberchainSubStateV3",JSON.stringify(s));}
function updateStreak(){const s=state(),today=new Date().toISOString().slice(0,10);if(s.lastDay!==today){const y=new Date(Date.now()-86400000).toISOString().slice(0,10);s.streak=s.lastDay===y?s.streak+1:1;s.lastDay=today;save(s);}document.getElementById('streakCount').textContent=s.streak;}
function switchView(id){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');window.scrollTo(0,0);}
function showHome(){switchView('homeView');}
function showHub(){switchView('hubView');updateStreak();renderLevels();}
function renderLevels(){const s=state(),grid=document.getElementById('levelGrid');grid.innerHTML='';subLevels.forEach((l,i)=>{const open=i<s.unlocked,best=s.scores[i]||0,card=document.createElement('article');card.className='level-card'+(open?'':' locked');card.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')} / ${l.name}</span>${open?'':'<span class="lock">LOCKED</span>'}<h2>${l.name} ${String(l.sub).padStart(2,'0')}</h2><p>SUB-LEVEL ${l.sub} / ${l.qs.length} QUESTIONS</p><div class="best">BEST SCORE / ${best}%</div><button class="${open?'start':'ghost'}" ${open?'':'disabled'}>${open?'START →':'LOCKED'}</button>`;if(open)card.querySelector('button').onclick=()=>startLevel(i);grid.appendChild(card);});}
function startLevel(i){currentLevel=i;currentQ=0;score=0;switchView('quizView');renderQuestion();}
function renderQuestion(){answered=false;const l=subLevels[currentLevel],q=l.qs[currentQ];document.getElementById('quizMeta').textContent=`${l.name} / ${String(l.sub).padStart(2,'0')}`;document.getElementById('progressText').textContent=`${currentQ+1} / ${l.qs.length}`;document.getElementById('progressBar').style.width=`${currentQ/l.qs.length*100}%`;document.getElementById('questionTag').textContent=q[6]+' /';document.getElementById('questionText').textContent=q[0];const a=document.getElementById('answers');a.innerHTML='';q.slice(1,5).forEach((text,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'.  '+text;b.onclick=()=>choose(i);a.appendChild(b);});document.getElementById('nextBtn').classList.add('hidden');}
function choose(i){if(answered)return;answered=true;const q=subLevels[currentLevel].qs[currentQ],bs=[...document.querySelectorAll('.answer')];bs.forEach((b,n)=>{b.disabled=true;if(n===q[5])b.classList.add('correct');if(n===i&&i!==q[5])b.classList.add('wrong');});if(i===q[5])score++;document.getElementById('nextBtn').classList.remove('hidden');}
function nextQuestion(){currentQ++;currentQ<subLevels[currentLevel].qs.length?renderQuestion():showResult();}
function showResult(){switchView('resultView');const l=subLevels[currentLevel],pct=Math.round(score/l.qs.length*100),pass=pct>=60,s=state();s.scores[currentLevel]=Math.max(s.scores[currentLevel]||0,pct);if(pass)s.unlocked=Math.max(s.unlocked,Math.min(subLevels.length,currentLevel+2));save(s);document.getElementById('scoreNum').textContent=score;document.getElementById('scoreTotal').textContent='/ '+l.qs.length;document.getElementById('resultTitle').textContent=pass?'PASSED':'TRY AGAIN';document.getElementById('resultText').textContent=pass?(currentLevel<subLevels.length-1?`${pct}% correct. The next sub-level is now unlocked.`:`${pct}% correct. You completed all sub-levels.`):`${pct}% correct. You need at least 60% to unlock the next sub-level.`;document.getElementById('progressBar').style.width='100%';}
function retryLevel(){startLevel(currentLevel);}

window.loadCyberQuiz = function() {
  const container = document.getElementById('quizContainer');
  if (!container) return;

  container.innerHTML = `
    <div class="view home" id="homeView">
      <h1>CYBERCHAIN</h1>
      <button class="start" onclick="showHub()">ENTER →</button>
    </div>
    <div class="view hidden" id="hubView">
      <header>
        <button class="back" onclick="showHome()">← BACK</button>
        <div class="streak">STREAK <b id="streakCount">0</b></div>
      </header>
      <div class="hub-title">
        <span>SUB-LEVEL HUB</span>
        <h1>CyberChain Quiz</h1>
        <p>Complete sub-levels to unlock harder content. 60% to pass.</p>
      </div>
      <div class="level-grid" id="levelGrid"></div>
    </div>
    <div class="view hidden" id="quizView">
      <header>
        <button class="back" onclick="showHub()">← HUB</button>
        <div id="quizMeta" style="color:var(--red);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:1px;"></div>
      </header>
      <div class="question">
        <span id="questionTag"></span>
        <h1 id="questionText"></h1>
        <div class="progress"><div id="progressBar"></div></div>
        <div class="answers" id="answers"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;">
          <span id="progressText" style="font-family:'IBM Plex Mono',monospace;color:var(--muted);"></span>
          <button class="next hidden" id="nextBtn" onclick="nextQuestion()">NEXT →</button>
        </div>
      </div>
    </div>
    <div class="view hidden" id="resultView">
      <header><button class="back" onclick="showHub()">← HUB</button></header>
      <div class="result">
        <h1 id="resultTitle"></h1>
        <div class="score"><b id="scoreNum">0</b><small id="scoreTotal"></small></div>
        <p id="resultText"></p>
        <button class="start" onclick="retryLevel()">RETRY</button>
        <button class="ghost" onclick="showHub()">BACK TO HUB</button>
      </div>
    </div>
  `;

  // Make functions globally accessible
  window.showHome = showHome;
  window.showHub = showHub;
  window.startLevel = startLevel;
  window.nextQuestion = nextQuestion;
  window.retryLevel = retryLevel;

  // Initialize
  showHome();
};
</script>
