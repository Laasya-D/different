<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blockchain Club</title>
<meta name="description" content="A university student organization researching distributed systems, applied cryptography, and offensive & defensive security." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js">
document.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#/"]');
  if(!link || e.defaultPrevented) return;
  const href = link.getAttribute('href');
  if(!href || href === location.hash) return;
  runAsciiTransition(href);
});

</script>
<style>
  

.blockchain-demo-section{
  border-top:1px solid var(--border);
}

.blockchain-demo-intro{
  max-width:600px;
  margin-bottom:40px;
}

.blockchain-demo{
  display:grid;
  grid-template-columns:1.5fr .8fr;
  gap:40px;
  align-items:start;
}

.chain{
  display:flex;
  align-items:center;
  gap:14px;
  overflow-x:auto;
  padding:20px 0 30px;
}

.chain-block{
  flex:0 0 190px;
  padding:18px;
  border:1px solid var(--border);
  background:var(--bg-alt);
  position:relative;
  transition:
    transform .3s ease,
    border-color .3s ease;
}

.chain-block:hover{
  transform:translateY(-4px);
  border-color:var(--accent);
}

.block-top{
  display:flex;
  justify-content:space-between;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--text-faint);
}

.block-line{
  height:1px;
  background:var(--border);
  margin:14px 0;
}

.block-data{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text);
  min-height:34px;
}

.block-hash{
  margin-top:18px;
  font-size:9px;
  color:var(--accent-bright);
}

.chain-block:not(:last-child)::after{
  content:'→';
  position:absolute;
  right:-25px;
  top:50%;
  transform:translateY(-50%);
  color:var(--accent);
  font-family:'JetBrains Mono',monospace;
}

.transaction-panel{
  padding:24px;
  border:1px solid var(--border);
  background:var(--bg-alt);
}

.transaction-inputs{
  display:flex;
  align-items:center;
  gap:10px;
  margin:22px 0;
}

.transaction-inputs input{
  width:100%;
  min-width:0;
  padding:12px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  outline:none;
}

.transaction-inputs input:focus{
  border-color:var(--accent);
}

.tx-arrow{
  color:var(--accent);
  font-family:'JetBrains Mono',monospace;
}

.blockchain-status{
  margin-top:18px;
  font-size:9px;
  letter-spacing:.08em;
  color:var(--text-faint);
}

@media(max-width:800px){
  .blockchain-demo{
    grid-template-columns:1fr;
  }
}
  .selected-event{
  margin-top:16px;
  padding:16px;
  border-left:2px solid var(--accent);
  background:var(--accent-dim);
}

.selected-event-title{
  font-size:16px;
  color:var(--text);
}

.selected-event-meta{
  margin-top:7px;
  color:var(--text-faint);
  font-size:9px;
  letter-spacing:.05em;
}

.selected-event-description{
  margin-top:12px;
  color:var(--text-dim);
  font-size:13px;
  line-height:1.6;
}
  .calendar-event-dot{
  width:6px;
  height:6px;
  margin-top:10px;
  background:var(--accent);
  border-radius:50%;
}co

.calendar-details{
  padding:26px 30px;
  border-top:1px solid var(--border);
  background:rgba(255,255,255,.01);
}

.calendar-details h3{
  margin-top:10px;
  font-size:18px;
  font-weight:500;
}

.calendar-details p{
  margin-top:8px;
  color:var(--text-dim);
  font-size:13px;
  line-height:1.6;
}

.calendar-day{
  cursor:pointer;
}

.calendar-day.selected{
  background:var(--accent-dim);
}

.calendar-day.selected .calendar-number{
  color:var(--text);
}
.calendar-events{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.calendar-event{
  padding:5px 7px;
  border-left:2px solid var(--accent);
  background:var(--accent-dim);
  color:var(--text);
  font-family:var(--font-mono);
  font-size:9px;
  line-height:1.4;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
:root{
  --bg:#070707;
  --bg-alt:#0c0c0c;
  --bg-elevated:#111110;
  --text:#f1ece1;
  --text-dim:#8b8a85;
  --text-faint:#4c4b47;
  --border:#1d1d1c;
  --border-light:#2b2b29;
  --accent:#900c20;
  --accent-bright:#900c20;
  --accent-dim:#2c1216;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --container:1240px;
  --radius:2px;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-weight:400;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;margin:0;letter-spacing:-0.01em;color:var(--text);}
p{margin:0;}
a{color:inherit;text-decoration:none;}
ul{margin:0;padding:0;list-style:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:var(--font-body);}
img{max-width:100%;display:block;}
::selection{background:var(--accent);color:#fff;}
:focus-visible{outline:1.5px solid var(--accent-bright);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
}
.container{max-width:var(--container);margin:0 auto;padding:0 32px;}
.mono{font-family:var(--font-mono);}
.text-dim{color:var(--text-dim);}
.text-faint{color:var(--text-faint);}
.accent{color:var(--accent-bright);}

.eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--text-dim);display:inline-flex;align-items:center;gap:8px;
}
.eyebrow::before{content:'';width:5px;height:5px;background:var(--accent);display:inline-block;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 26px;font-family:var(--font-mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
  border:1px solid var(--border-light);border-radius:var(--radius);background:transparent;color:var(--text);
  transition:border-color .25s ease, background .25s ease, transform .25s ease, color .25s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#f7ede9;}
.btn-primary:hover{background:var(--accent-bright);border-color:var(--accent-bright);transform:translateY(-1px);}
.btn-outline:hover{border-color:var(--text-dim);transform:translateY(-1px);}
.btn-sm{padding:9px 16px;font-size:10.5px;}
.link-btn{font-size:11px;letter-spacing:.08em;color:var(--text-dim);border:none;background:none;padding:4px 0;border-bottom:1px solid transparent;}
.link-btn:hover{color:var(--text);border-color:var(--text-dim);}
.link-btn.danger:hover{color:var(--accent-bright);border-color:var(--accent-bright);}
.big-num{font-family:var(--font-display);font-weight:300;color:var(--text-faint);line-height:1;}
.divider{border:none;border-top:1px solid var(--border);margin:0;}
.badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;padding:4px 8px;border:1px solid var(--border-light);text-transform:uppercase;color:var(--text-dim);}
.badge.published{color:#c9c4b8;border-color:#3a3a37;}
.badge.draft{color:var(--text-faint);}
.status-dot{width:6px;height:6px;border-radius:50%;background:#7fae86;display:inline-block;box-shadow:0 0 6px #7fae8688;}
.status-badge{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.1em;color:var(--text-dim);}

.section{padding:100px 0;border-top:1px solid var(--border);}
.section:first-of-type{border-top:none;}
.section-head{display:flex;gap:28px;align-items:flex-start;margin-bottom:56px;}
.section-head .big-num{font-size:56px;min-width:70px;}
.section-head h2{font-size:clamp(26px,3.4vw,38px);text-transform:uppercase;letter-spacing:0.01em;}
.section-head .section-copy{color:var(--text-dim);max-width:440px;margin-top:10px;font-size:15px;}
.section-top-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;}

.nav{position:fixed;top:0;left:0;right:0;z-index:10000;border-bottom:1px solid var(--border);
  background:rgba(7,7,7,.85);backdrop-filter:blur(12px);}
.nav-inner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;height:76px;gap:24px;}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text);
  flex-shrink: 0;
}

.nav-logo .nav-logo-img {
  width: 48px;
  height: 48px;
  object-fit: contain;
  display: block;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.02em;
  white-space: nowrap;
  color: var(--text);
}
.nav-links{display:flex;gap:8px;align-items:center;justify-content:center;}
.nav-link{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);position:relative;padding:8px 16px;transition:color .2s, background .2s;border-radius:6px;}
.nav-link:hover,.nav-link.active{color:var(--text);background:rgba(144,12,32,.15);}
.nav-dropdown{position:relative;height:100%;display:flex;align-items:center;}
.nav-dropdown-toggle{border:0;background:none;color:var(--text-dim);font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:6px;border-radius:6px;transition:color .2s, background .2s;}
.nav-dropdown-toggle:hover{color:var(--text);background:rgba(144,12,32,.15);}
.nav-dropdown-toggle::after{content:'';width:6px;height:6px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s ease;}
.nav-dropdown:hover .nav-dropdown-toggle,.nav-dropdown.open .nav-dropdown-toggle{color:var(--text);background:rgba(144,12,32,.15);}
.nav-dropdown:hover .nav-dropdown-toggle::after,.nav-dropdown.open .nav-dropdown-toggle::after{transform:rotate(225deg) translate(-1px,-1px);}
.nav-dropdown-menu{position:absolute;top:calc(100% + 8px);left:0;width:280px;padding:8px;background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .2s ease,transform .2s ease,visibility .2s ease;z-index:10001;}
.nav-dropdown-menu::before{content:'';position:absolute;top:-6px;left:24px;width:10px;height:10px;background:var(--bg-alt);border-left:1px solid var(--border);border-top:1px solid var(--border);transform:rotate(45deg);}
.nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown.open .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateY(0);}
.nav-dropdown-item{display:flex;flex-direction:column;gap:4px;padding:12px 16px;text-decoration:none;color:var(--text-dim);background:transparent;transition:background .2s ease,color .2s ease;border-radius:6px;}
.nav-dropdown-item:hover{background:rgba(144,12,32,.12);color:var(--text);}
.nav-dropdown-title{font-family:var(--font-mono);font-size:13px;letter-spacing:.03em;color:var(--text);}
.nav-dropdown-desc{font-family:var(--font-body);font-size:11px;color:var(--text-dim);line-height:1.4;}
.nav-toggle{display:none;flex-direction:column;gap:5px;background:none;border:none;padding:8px;}
.nav-toggle span{width:20px;height:1px;background:var(--text);display:block;}
.nav-auth{display:flex;align-items:center;gap:12px;justify-self:end;}
.nav-auth-btn{border:0;background:none;color:var(--text-dim);font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;cursor:pointer;border-radius:6px;transition:color .2s, background .2s;}
.nav-auth-btn:hover{color:var(--text);background:rgba(144,12,32,.15);}
.nav-auth-btn.primary{color:var(--accent-bright);background:rgba(144,12,32,.15);}
.nav-auth-btn.primary:hover{color:var(--accent);background:rgba(144,12,32,.25);}

.nav-profile{position:relative;}
.nav-profile-trigger{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--text-dim);font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;cursor:pointer;border-radius:6px;transition:color .2s, background .2s;}
.nav-profile-trigger:hover{color:var(--text);background:rgba(144,12,32,.15);}
.nav-profile-name{color:var(--text);}
.nav-profile-chevron{font-size:8px;color:var(--text-dim);transition:transform .2s;width:6px;height:6px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg) translateY(-2px);display:inline-block;}
.nav-profile[aria-expanded="true"] .nav-profile-chevron{transform:rotate(225deg) translate(-1px,-1px);}

.nav-profile-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:200px;background:var(--bg-alt);border:1px solid var(--border);box-shadow:0 12px 32px rgba(0,0,0,.4);z-index:10001;padding:8px;display:flex;flex-direction:column;gap:4px;visibility:hidden;opacity:0;transform:translateY(-8px);transition:visibility 0.2s, opacity 0.2s, transform 0.2s;}
.nav-profile[aria-expanded="true"] .nav-profile-menu{visibility:visible;opacity:1;transform:translateY(0);}
.nav-profile-email{display:block;padding:8px 12px;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);border-bottom:1px solid var(--border);margin-bottom:4px;}
.nav-profile-divider{height:1px;background:var(--border);margin:4px 0;}
.nav-profile-item{display:flex;align-items:center;padding:10px 12px;color:var(--text-dim);font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;background:none;border:0;cursor:pointer;text-decoration:none;transition:color .2s,background .2s;}
.nav-profile-item:hover{color:var(--accent-bright);background:rgba(184,24,48,.1);}
.nav-profile-logout{color:var(--accent-bright);width:100%;text-align:left;}
.nav-profile-logout:hover{color:var(--accent);background:rgba(184,24,48,.15);}

@media (max-width:900px){
  .nav-inner{grid-template-columns:auto 1fr auto;gap:16px;}
  .nav-links{position:fixed;top:76px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--border);
    flex-direction:column;gap:0;max-height:0;overflow:hidden;transition:max-height .3s ease;align-items:stretch;}
  .nav.nav-open .nav-links{max-height:760px;}
  .nav-links .nav-link{padding:16px 32px;border-top:1px solid var(--border);width:100%;border-radius:0;}
  .nav-dropdown{display:block;height:auto;border-top:1px solid var(--border);}
  .nav-dropdown-toggle{padding:16px 32px;width:100%;justify-content:space-between;border-radius:0;}
  .nav-dropdown-menu{position:static;width:auto;margin:0 18px 14px;box-shadow:none;transform:none;display:none;opacity:1;visibility:visible;border-radius:0;}
  .nav-dropdown-menu::before{display:none;}
  .nav-dropdown.open .nav-dropdown-menu{display:block;}
  .nav-dropdown-item{padding:16px 14px;}
  .nav-auth{position:static;flex-direction:column;width:100%;padding:0 32px 16px;gap:8px;justify-self:auto;}
  .nav-auth .nav-auth-btn,.nav-auth .nav-profile-trigger{width:100%;text-align:left;border-radius:0;padding:16px 32px;}
  .nav-profile-menu{position:static;width:auto;margin:8px 32px 0;box-shadow:none;transform:none;display:none;opacity:1;visibility:visible;border-radius:0;background:var(--bg);border:0;border-top:1px solid var(--border);}
  .nav-profile[aria-expanded="true"] .nav-profile-menu{display:flex;}
  .nav-toggle{display:flex;}
}

.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:70px;overflow:hidden;}
.network-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.4;pointer-events:none;}
.hero-inner{position:relative;z-index:2;} .hero-title::after{content:"";position:absolute;left:-10%;top:8%;width:75%;height:72%;background:radial-gradient(ellipse,rgba(144,12,32,.18),transparent 68%);filter:blur(20px);z-index:-1;pointer-events:none;}
.hero-title{font-size:clamp(38px,7.2vw,84px);text-transform:uppercase;line-height:.98;letter-spacing:-0.01em;margin:14px 0 26px;position:relative;text-shadow:0 0 34px rgba(208,43,68,.18);}
.hero-title span{display:block;}
.hero-desc{max-width:520px;color:var(--text-dim);font-size:16px;margin-bottom:36px;}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;}

.games-promo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.72fr);gap:56px;align-items:center;}
.packet-mini{border:1px solid var(--border);background:rgba(255,255,255,.015);padding:20px;min-height:230px;}
.packet-mini-head,.packet-mini-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.packet-stream{display:grid;gap:7px;margin:22px 0;min-height:108px;}
.packet-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;font:10px var(--font-mono);color:var(--text-dim);}
.packet-bar{height:5px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;}
.packet-bar span{display:block;height:100%;width:42%;background:rgba(208,43,68,.8);animation:packetMove 1.8s linear infinite;}
.packet-row.safe .packet-bar span{background:rgba(230,225,215,.28);}
.packet-mini-actions{border-top:1px solid var(--border);padding-top:14px;}
@keyframes packetMove{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media (max-width:800px){.games-promo-grid{grid-template-columns:1fr;gap:30px;}}
.games-page-card{border:1px solid var(--border);padding:34px;display:flex;justify-content:space-between;align-items:center;gap:28px;background:rgba(255,255,255,.015);}.games-page-card h2{margin:10px 0;font-size:clamp(30px,4vw,54px);}@media(max-width:700px){.games-page-card{flex-direction:column;align-items:flex-start;}}

.row-list{display:flex;flex-direction:column;}
.row-item{display:grid;grid-template-columns:60px 1fr auto;gap:20px;align-items:center;padding:26px 4px;
  border-top:1px solid var(--border);transition:padding-left .25s ease,border-color .25s ease;position:relative;}
.row-list a.row-item{border-top:1px solid var(--border);}
.row-item:last-child{border-bottom:1px solid var(--border);}
.row-item:hover{padding-left:14px;border-color:var(--border-light);}
.row-item:hover .row-arrow{transform:translateX(4px);opacity:1;}
.row-index{font-family:var(--font-mono);color:var(--text-faint);font-size:13px;}
.row-main .row-type{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--accent-bright);text-transform:uppercase;margin-bottom:6px;}
.row-main h3{font-size:19px;font-weight:500;margin-bottom:4px;}
.row-main .row-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);letter-spacing:.03em;}
.row-arrow{font-family:var(--font-mono);color:var(--text-dim);opacity:.5;transition:all .25s ease;}
@media (max-width:640px){.row-item{grid-template-columns:32px 1fr auto;}.row-main h3{font-size:16px;}}

.grid{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid > *{background:var(--bg);padding:32px;}
@media (max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.grid-3,.grid-4{grid-template-columns:1fr;}}

.img-placeholder{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;
  background:repeating-linear-gradient(135deg, var(--border) 0 1px, transparent 1px 13px), var(--bg-elevated);
  border:1px solid var(--border);}
.img-placeholder::after{content:'';position:absolute;top:10px;right:10px;width:6px;height:6px;background:var(--accent);}
.img-placeholder.portrait{aspect-ratio:3/4;}
.cover-img{width:100%;aspect-ratio:16/10;object-fit:cover;border:1px solid var(--border);}
.cover-img.portrait{aspect-ratio:3/4;}

.blog-card{border:1px solid var(--border);padding:0;display:flex;flex-direction:column;transition:border-color .25s ease;}
.blog-card:hover{border-color:var(--border-light);}

#page-transition{
  position:fixed;
  inset:0;
  z-index:9999;
  pointer-events:none;
  visibility:hidden;
  display:grid;
  place-items:center;
  background:rgba(7,7,7,.94);
}
#page-transition .transition-art{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(520px,86vw);
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  white-space:pre;
  color:#900c20;
  font-family:var(--font-mono);
  font-size:clamp(11px,1.5vw,15px);
  line-height:1.25;
  letter-spacing:.04em;
  text-shadow:0 0 16px rgba(208,43,68,.8);
  opacity:0;
}
#page-transition .transition-label{
  position:absolute;
  left:50%;
  top:calc(50% + 115px);
  transform:translateX(-50%);
  color:#e8e4dc;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.2em;
  white-space:nowrap;
  opacity:0;
}
#page-transition.active{
  visibility:visible;
  animation:transitionIn .18s ease-out both;
}
#page-transition.active .transition-art{
  animation:asciiBuild .58s cubic-bezier(.2,.75,.25,1) both;
}
#page-transition.active .transition-label{
  animation:transitionLabel .45s ease .18s both;
}
#page-transition.reveal{
  visibility:visible;
  animation:transitionOut .42s ease .02s both;
}
@keyframes transitionIn{
  from{opacity:0}
  to{opacity:1}
}
@keyframes transitionOut{
  from{opacity:1}
  to{opacity:0;visibility:hidden}
}
@keyframes asciiBuild{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.78);filter:blur(5px)}
  45%{opacity:1;transform:translate(-50%,-50%) scale(1.02);filter:blur(0)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@keyframes transitionLabel{
  from{opacity:0;transform:translateX(-50%) translateY(5px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}

.calendar{
  max-width:900px;
  margin:0 auto;
  border:1px solid var(--border);
  background:var(--bg-alt);
}

.calendar-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:26px 30px;
  border-bottom:1px solid var(--border);
}

.calendar-header > div{
  text-align:center;
}

.calendar-month{
  font-family:var(--font-display);
  font-size:24px;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:.02em;
}

.calendar-year{
  margin-top:4px;
  color:var(--text-faint);
  font-size:10px;
  letter-spacing:.14em;
}

.calendar-nav{
  width:40px;
  height:40px;
  border:1px solid var(--border-light);
  background:transparent;
  color:var(--text-dim);
  font-size:16px;
  transition:
    border-color .2s ease,
    color .2s ease,
    background .2s ease;
}

.calendar-nav:hover{
  color:var(--text);
  border-color:var(--accent);
  background:var(--accent-dim);
}

.calendar-weekdays,
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
}

.calendar-weekdays{
  border-bottom:1px solid var(--border);
}

.calendar-weekdays div{
  padding:14px 10px;
  text-align:center;
  color:var(--text-faint);
  font-size:9px;
  letter-spacing:.1em;
}

.calendar-day{
  min-height:100px;
  padding:12px;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  color:var(--text-dim);
  position:relative;
  transition:
    background .2s ease,
    color .2s ease;
}

.calendar-day:nth-child(7n){
  border-right:none;
}

.calendar-day:hover{
  background:rgba(255,255,255,.018);
  color:var(--text);
}

.calendar-day.empty{
  background:rgba(255,255,255,.008);
}

.calendar-number{
  font-family:var(--font-mono);
  font-size:11px;
}

.calendar-day.today .calendar-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  background:var(--accent);
  color:#fff;
}

/* Highlight days that have events - vibrant and clear */
.calendar-day.has-events{
  background:rgba(144,12,32,.12);
  border-right:1px solid var(--accent);
  border-bottom:1px solid var(--accent);
}
.calendar-day.has-events:nth-child(7n){
  border-right:1px solid var(--accent);
}
.calendar-day.has-events .calendar-number{
  color:var(--accent-bright);
  font-weight:700;
  font-size:13px;
}
.calendar-day.has-events.today .calendar-event-dot{
  display:block;
  width:8px;
  height:8px;
  background:var(--accent-bright);
  border-radius:50%;
  margin:4px auto 0;
  box-shadow:0 0 8px var(--accent-bright);
}
.calendar-day.has-events:not(.today) .calendar-event-dot{
  display:none;
}
.calendar-day.has-events:hover{
  background:rgba(144,12,32,.25);
  color:var(--text);
}
.calendar-day.has-events:hover .calendar-number{
  color:var(--accent);
}
.calendar-day.has-events.today .calendar-number{
  background:var(--accent);
  color:#fff;
  box-shadow:0 0 12px rgba(184,24,48,.5);
}
.calendar-day.has-events.today .calendar-number::after{
  content:'';
  position:absolute;
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
  width:6px;
  height:6px;
  background:var(--accent-bright);
  border-radius:50%;
  box-shadow:0 0 0 2px #050505;
}

/* Event badge inside day cell */
.calendar-day.has-events .calendar-events{
  margin-top:6px;
}
.calendar-day.has-events .calendar-event{
  background:rgba(144,12,32,.9);
  color:#fff;
  font-size:8px;
  padding:2px 6px;
  border-radius:3px;
  margin:2px 0;
  font-family:var(--font-mono);
  text-transform:uppercase;
  letter-spacing:.05em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}

.calendar-empty{

}

}

.calendar-empty p{
  margin-top:8px;
  color:var(--text-dim);

}

#security-loader{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#050505;
  color:#f1ece1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  transition:opacity .8s ease, visibility .8s ease;
}
#security-loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.security-loader-wrap{
  position:relative;
  width:min(430px,78vw);
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
}
.security-loader-ring{
  position:absolute;
  inset:-22px;
  border-radius:50%;
  background:conic-gradient(from -90deg,#900c20 0deg,#d02b44 80deg,rgba(144,12,32,.45) 180deg,rgba(144,12,32,.12) 275deg,rgba(144,12,32,.06) 330deg,#900c20 360deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  animation:loaderRing 2.6s linear infinite;
  opacity:.95;
}
.security-loader-ring::after{
  content:"";
  position:absolute;
  inset:7px;

<style id="actual-hover-system">
:root{
  --hover-red:#74101d;
  --hover-red-strong:#8d1727;
  --hover-red-soft:rgba(116,16,29,.78);
  --hover-red-line:#a32134;
}

/* NAVIGATION */
.nav-link,
.nav-dropdown-toggle{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  padding:11px 14px;
  transition:color .25s ease;
}
.nav-link::after{
  content:"";
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:var(--hover-red);
  transform:translateX(-102%);
  transition:transform .32s cubic-bezier(.2,.75,.2,1);
  z-index:-1;
}
.nav-link:hover::after,
.nav-link.active::after{transform:translateX(0);}
.nav-link:hover,
.nav-link.active{color:#fff!important;}
.nav-dropdown-toggle::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--hover-red);
  transform:translateX(-102%);
  transition:transform .32s cubic-bezier(.2,.75,.2,1);
  z-index:-1;
}
.nav-dropdown-toggle:hover::before,
.nav-dropdown.open .nav-dropdown-toggle::before{transform:translateX(0);}
.nav-dropdown-toggle:hover,
.nav-dropdown.open .nav-dropdown-toggle{color:#fff!important;}

/* LABS DROPDOWN */
.nav-dropdown-menu{border:1px solid rgba(116,16,29,.55)!important;}
.nav-dropdown-item{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  transition:color .25s ease,transform .25s ease!important;
}
.nav-dropdown-item::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--hover-red);
  transform:translateX(-102%);
  transition:transform .3s cubic-bezier(.2,.75,.2,1);
  z-index:-1;
}
.nav-dropdown-item:hover::before{transform:translateX(0);}
.nav-dropdown-item:hover{color:#fff!important;transform:translateX(3px);}
.nav-dropdown-item:hover .nav-dropdown-desc{color:rgba(255,255,255,.7);}
.nav-dropdown-item:hover .nav-dropdown-icon{border-color:rgba(255,255,255,.45);color:#fff;}

/* ALL LARGE BLOCKS */
.calendar-event,
.home-crypto-card,
.blog-card,
.professor-card,
.games-page-card,
.packet-game-row,
.lab-link-card,
.project-tile,
.wwd-item,
.row-item,
.grid > *,
.empty-state{
  position:relative;
  isolation:isolate;
  overflow:hidden;
}

.calendar-event::before,
.home-crypto-card::before,
.blog-card::before,
.professor-card::before,
.games-page-card::before,
.packet-game-row::before,
.lab-link-card::before,
.project-tile::before,
.wwd-item::before,
.row-item::before,
.grid > *::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(105deg,var(--hover-red) 0%,var(--hover-red-soft) 100%);
  transform:translateX(-102%);
  transition:transform .38s cubic-bezier(.2,.75,.2,1);
  z-index:-1;
  pointer-events:none;
}

.calendar-event:hover::before,
.home-crypto-card:hover::before,
.blog-card:hover::before,
.professor-card:hover::before,
.games-page-card:hover::before,
.packet-game-row:hover::before,
.lab-link-card:hover::before,
.project-tile:hover::before,
.wwd-item:hover::before,
.row-item:hover::before,
.grid > *:hover::before{transform:translateX(0);}

.calendar-event:hover,
.home-crypto-card:hover,
.blog-card:hover,
.professor-card:hover,
.games-page-card:hover,
.packet-game-row:hover,
.lab-link-card:hover,
.project-tile:hover,
.wwd-item:hover,
.row-item:hover,
.grid > *:hover{
  border-color:var(--hover-red-line)!important;
  transform:translateY(-2px);
  transition:transform .25s ease,border-color .25s ease!important;
}

.home-crypto-card > *,
.blog-card > *,
.professor-card > *,
.games-page-card > *,
.packet-game-row > *,
.lab-link-card > *,
.project-tile > *,
.wwd-item > *,
.grid > * > *,
.calendar-event > *,
.row-item > *{position:relative;z-index:1;}

/* CALENDAR */
.calendar-day{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  transition:color .25s ease,transform .25s ease!important;
}
.calendar-day::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--hover-red);
  transform:translateY(102%);
  transition:transform .3s cubic-bezier(.2,.75,.2,1);
  z-index:-1;
}
.calendar-day:hover::before{transform:translateY(0);}
.calendar-day:hover{color:#fff!important;transform:translateY(-2px);}
.calendar-day:hover .calendar-number{color:#fff!important;}
.calendar-day:hover .calendar-event{background:rgba(0,0,0,.18)!important;}
.calendar-day.selected{background:var(--hover-red)!important;color:#fff!important;}
.calendar-nav{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  border-color:var(--border-light);
  transition:color .25s ease,transform .2s ease!important;
}
.calendar-nav::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--hover-red);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .28s cubic-bezier(.2,.75,.2,1);
  z-index:-1;
}
.calendar-nav:hover::before{transform:scaleX(1);}
.calendar-nav:hover{color:#fff!important;border-color:var(--hover-red-line)!important;transform:translateY(-2px);}
.calendar-nav:active{transform:translateY(1px) scale(.97);}

/* BUTTONS */
.btn,
.packet-difficulty-btn,
.crypto-selector-btn,
.link-btn,
.admin-nav a{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  transition:color .25s ease,border-color .25s ease,transform .2s ease!important;
}
.btn::before,
.packet-difficulty-btn::before,
.crypto-selector-btn::before,
.link-btn::before,
.admin-nav a::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--hover-red);
  transform:translateX(-102%);
  transition:transform .28s cubic-bezier(.2,.75,.2,1);
  z-index:-1;
}
.btn:hover::before,
.packet-difficulty-btn:hover::before,
.crypto-selector-btn:hover::before,
.link-btn:hover::before,
.admin-nav a:hover::before{transform:translateX(0);}
.btn:hover,
.packet-difficulty-btn:hover,
.crypto-selector-btn:hover,
.link-btn:hover,
.admin-nav a:hover{
  color:#fff!important;
  border-color:var(--hover-red-line)!important;
  transform:translateY(-2px);
}
.btn:active,
.packet-difficulty-btn:active,
.crypto-selector-btn:active,
.link-btn:active{transform:translateY(1px) scale(.98)!important;}

/* TEXT LINKS */
.footer-col a,
.professor-card a,
.row-item a,
.lab-link-card a{
  position:relative;
  transition:color .2s ease!important;
}
.footer-col a::after,
.professor-card a::after{
  content:"";
  position:absolute;
  left:0;
  right:100%;
  bottom:-3px;
  height:1px;
  background:var(--hover-red-line);
  transition:right .25s ease;
}
.footer-col a:hover::after,
.professor-card a:hover::after{right:0;}
.footer-col a:hover,
.professor-card a:hover{color:#fff!important;}

/* CRYPTO INPUTS */
.home-crypto-field{
  position:relative;
  transition:border-color .25s ease,background .25s ease,transform .2s ease;
}
.home-crypto-field:focus-within{
  border-color:var(--hover-red-line)!important;
  background:rgba(116,16,29,.24);
  transform:translateY(-1px);
}
.home-crypto-field:focus-within label{color:#fff;}

/* RED ACCENT FOR ACTIVE STATES */
.crypto-selector-btn.active,
.packet-difficulty-btn.active{
  background:var(--hover-red)!important;
  border-color:var(--hover-red-line)!important;
  color:#fff!important;
}

/* RESPECT REDUCED MOTION */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;}
}
</style>

function getTransitionKey(path){
  const clean = String(path || '').replace(/^#\/?/, '').split('/')[0];
  return ASCII_TRANSITIONS[clean] ? clean : 'games';
}

function runAsciiTransition(path, done){
  const overlay = document.getElementById('ascii-transition');
  const art = document.getElementById('ascii-art');
  const label = document.getElementById('ascii-label');
  if(!overlay || !art || !label){
    if(done) done();
    return;
  }

  const config = ASCII_TRANSITIONS[getTransitionKey(path)];
  art.textContent = config.art.join('\n');
  label.textContent = '→ ' + config.label + ' →';

  overlay.classList.add('active');
  overlay.setAttribute('aria-hidden','false');

  setTimeout(() => {
    if(done) done();
  }, 1050);

  setTimeout(() => {
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden','true');
  }, 650);
}

const store = {
  async get(key, shared = true){
    try{
      const r = localStorage.getItem(key);
      return r ? JSON.parse(r) : null;
    }catch(e){ return null; }
  },
  async set(key, value, shared = true){
    try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e){ console.error('storage.set failed', e); return false; }
  },
  async remove(key, shared = true){
    try{ localStorage.removeItem(key); return true; }
    catch(e){ return false; }
  }
};

function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(ts){
  if(!ts) return '—';
  const d = typeof ts === 'number' ? new Date(ts) : new Date(ts);
  if(isNaN(d.getTime())) return esc(ts);
  return d.toLocaleDateString('en-US',{ day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
}
function showToast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast mono';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function initBlockchainDemo(){

  const chain = document.getElementById('demo-chain');
  const button = document.getElementById('add-block-btn');
  const fromInput = document.getElementById('tx-from');
  const toInput = document.getElementById('tx-to');
  const status = document.getElementById('blockchain-status');

  if(!chain || !button) return;

  let blockNumber = 0;

  button.addEventListener('click', () => {

    const from = fromInput.value.trim();
    const to = toInput.value.trim();

    if(!from || !to){

      status.textContent =
        'ENTER BOTH ADDRESSES';

      return;
    }

    status.textContent =
      'MINING BLOCK...';

    button.disabled = true;

    setTimeout(() => {

      blockNumber++;

      const block = document.createElement('div');

      block.className = 'chain-block';

      const fakeHash =
        Math.random()
          .toString(16)
          .slice(2,6)
          .toUpperCase();

      block.innerHTML = `
        <div class="block-top">
          <span>BLOCK</span>
          <span>#${String(blockNumber).padStart(2,'0')}</span>
        </div>

        <div class="block-line"></div>

        <div class="block-data">
          ${from} → ${to}
        </div>

        <div class="block-hash mono">
          HASH: ${fakeHash}
        </div>
      `;

      chain.appendChild(block);

      status.textContent =
        `✓ BLOCK #${String(blockNumber).padStart(2,'0')} CONFIRMED`;

      fromInput.value = '';
      toInput.value = '';

      button.disabled = false;

      block.scrollIntoView({
        behavior:'smooth',
        block:'nearest',
        inline:'end'
      });

    }, 700);
  });
}

function makeCollectionService(key){
  return {
    async getAll(){ return (await store.get(key)) || []; },
    async getPublished(){ return (await this.getAll()).filter(i => i.status === 'published'); },
    async getById(id){ return (await this.getAll()).find(i => i.id === id) || null; },
    async create(data){
      const list = await this.getAll();
      const item = { ...data, id: uid(), status: data.status || 'draft', createdAt: Date.now(), updatedAt: Date.now() };
      list.unshift(item);
      await store.set(key, list);
      return item;
    },
    async update(id, patch){
      const list = await this.getAll();
      const idx = list.findIndex(i => i.id === id);
      if(idx === -1) return null;
      list[idx] = { ...list[idx], ...patch, updatedAt: Date.now() };
      await store.set(key, list);
      return list[idx];
    },
    async delete(id){
      const list = (await this.getAll()).filter(i => i.id !== id);
      await store.set(key, list);
      return true;
    }
  };
}
function makeSingletonService(key, defaults){
  return {
    async get(){ const v = await store.get(key); return v || defaults; },
    async update(patch){
      const current = await this.get();
      const merged = { ...current, ...patch };
      await store.set(key, merged);
      return merged;
    }
  };
}

    if(password.length < 4){

    });
    return { ok:true, user };
  },

  // Admin only: create new admin users
  async createAdminUser(email, password, name, role){

    if(!currentUser || currentUser.role !== 'super_admin'){
      return { ok:false, error:'Only super admin can create admin users.' };
    }
    const existing = await adminUsersService.getAll();
    if(existing.some(u => String(u.email).toLowerCase() === String(email).toLowerCase())){
      return { ok:false, error:'That email already has access.' };
    }
    if(password.length < 4){

    });

function compilePattern(pattern){
  const paramNames = [];
  const regexStr = '^' + pattern.replace(/:[^/]+/g, m => { paramNames.push(m.slice(1)); return '([^/]+)'; }) + '$';
  return { regex: new RegExp(regexStr), paramNames };
}

function parseHash(){
  let h = location.hash.slice(1);
  if(!h) h = '/';
  if(h.length > 1 && h.endsWith('/')) h = h.slice(0, -1);
  return h;
}
function matchRoute(path){
  for(const route of routes){
    const m = path.match(route.regex);
    if(m){
      const params = {};
      route.paramNames.forEach((name,i) => params[name] = decodeURIComponent(m[i+1]));
      return { route, params };
    }
  }
  return null;
}

function transitionKey(path){
  const p = String(path || '/').replace(/^\//,'').split('/').filter(Boolean).map(x => x.toLowerCase());

  if(!p.length) return 'home';
  if(p[0] === 'admin') return 'admin';

  /* Connect gets the original ASCII tree. */
  if(p[0] === 'team') return 'connect';
  if(p[0] === 'contact'){
    if(sessionStorage.getItem('joinMemberTransition') === '1'){
      sessionStorage.removeItem('joinMemberTransition');
      return 'joinMember';
    }
    return 'contact';
  }

  /* Projects and Games are Labs sub-pages, so give each its own artwork. */
  if(p[0] === 'labs' && p[1] === 'projects') return 'projectsLab';
  if(p[0] === 'labs' && p[1] === 'games') return 'gamesLab';

  if(p[0] === 'courses' || p[0] === 'resources') return 'resources';

  return TRANSITION_ART[p[0]] ? p[0] : 'home';
}

function startPageTransition(path){
  if(firstPageLoad || path === '/') return;

  const transition = document.getElementById('page-transition');
  if(!transition) return;

  const art = document.getElementById('transition-art');
  const label = document.getElementById('transition-label');
  const key = transitionKey(path);

  if(art) art.textContent = TRANSITION_ART[key];
  if(label){
    const transitionLabels = {
      connect: 'BLOCKCHAIN CLUB // CONNECT',
      contact: 'BLOCKCHAIN // CONNECT // CONTACT',
      joinMember: 'BLOCKCHAIN // CLUB // JOIN AS A MEMBER',
      projectsLab: 'BLOCKCHAIN // LABS // PROJECT',
      gamesLab: 'BLOCKCHAIN // LABS // GAMES',
      resources: 'BLOCKCHAIN CLUB // RESOURCES'
    };
    label.textContent = transitionLabels[key] || `BLOCKCHAIN CLUB // ${key.toUpperCase()}`;
  }

  transition.classList.remove('reveal');
  void transition.offsetWidth;
  transition.classList.add('active');

  clearTimeout(transitionTimer);
}

function endPageTransition(){
  const transition = document.getElementById('page-transition');
  if(!transition || firstPageLoad) return;

  transition.classList.remove('active');
  transition.classList.add('reveal');

  transitionTimer = setTimeout(() => {
    transition.classList.remove('reveal');
  }, 1200);
}

async function render(){
  const path = parseHash();

  // Mark Events separately so the iOS Safari scroll fix only affects
  // that page and does not change scrolling/animations elsewhere.
  document.documentElement.classList.toggle('events-page', path === '/events');

  startPageTransition(path);

  const found = matchRoute(path);
  const app = document.getElementById('app');
  if(!found){
    app.innerHTML = `<div class="page-fade">${NotFoundPage()}</div>`;
    endPageTransition();
    firstPageLoad = false;
    return;
  }

  const { route, params } = found;
  if(route.admin && !route.skipGuard){
    const authed = await authService.isAuthenticated();
    if(!authed){ location.hash = '#/admin/login'; return; }
  }

  let html;
  try{ html = await route.view(params); }
  catch(e){ console.error(e); html = NotFoundPage(); }

  app.innerHTML = `<div class="page-fade">${html}${route.admin ? '' : SiteFooter()}</div>`;
  window.scrollTo(0,0);

  if(route.after) route.after(params);
  initGlobalWidgets(path);
  initHomeSymbolField();
  initChallengeGame();
  initInlinePacketPanic();
  if(path === '/') initHomeCrypto();

  if(path === '/events'){
    await initCalendar();
  }

  if(!firstPageLoad && path !== '/'){
    requestAnimationFrame(() => setTimeout(endPageTransition, 1350));
  }

  firstPageLoad = false;
}

    const el=document.getElementById(`home-crypto-chart-${id}`);
    if(!el) return;
    const data=(prices||[]).filter(p=>Array.isArray(p)&&p.length>=2).map(p=>({t:p[0],v:Number(p[1])})).filter(p=>Number.isFinite(p.v));
    if(data.length<2){
      el.innerHTML='<div class="home-crypto-loading">NO CHART DATA</div>';
      return;
    }
    // Mark as loaded
    el.setAttribute('data-loaded', 'true');
    el.setAttribute('data-fallback', isFallback ? 'true' : 'false');
    // Downsample to max 200 points for performance and spikier look
    const maxPoints=200;
    let sampled=data;
    if(data.length>maxPoints){
      const step=Math.ceil(data.length/maxPoints);
      sampled=[];
      for(let i=0;i<data.length;i+=step) sampled.push(data[i]);
      if(sampled[sampled.length-1]!==data[data.length-1]) sampled.push(data[data.length-1]);
    }
    const W=760,H=250,left=8,right=8,top=12,bottom=24;
    const min=Math.min(...sampled.map(d=>d.v));
    const max=Math.max(...sampled.map(d=>d.v));
    const span=(max-min)||1;
    const x=i=>left+(i/(sampled.length-1))*(W-left-right);
    const y=v=>top+(1-(v-min)/span)*(H-top-bottom);

    // Create TRUE SPIKES chart - TRADING TERMINAL STYLE
    // Ultra-sharp vertical spikes with red color, like Bloomberg/TradingView
    let spikePoints='';
    let spikeTops=''; // For drawing spike tips

    for(let i=0;i<sampled.length;i++){
      const xi=x(i);
      const yi=y(sampled[i].v);

      if(i===0){
        spikePoints+=`${xi},${yi} `;
      }else{
        const prevY=y(sampled[i-1].v);

        // PURE VERTICAL SPIKE - instant jump, zero horizontal travel
        // This creates the sharpest possible spikes
        spikePoints+=`${xi},${prevY} ${xi},${yi} `;

        // Also track spike tops for potential markers
        spikeTops+=`${xi},${yi} `;
      }
    }
    const areaPoints=sampled.map((d,i)=>`${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(' ');
    const area=`${left},${H-bottom} ${areaPoints} ${W-right},${H-bottom}`;

    const grid=[0,1,2,3].map(i=>{
      const gy=top+i*((H-top-bottom)/3);
      return `<line x1="${left}" x2="${W-right}" y1="${gy}" y2="${gy}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    }).join('');

    const last=sampled[sampled.length-1];
    el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${id} price fluctuation graph in Indian rupees" style="width:100%;height:100%;">
      <defs>
        <linearGradient id="homeCryptoFill-${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,51,51,.18)"/>
          <stop offset="100%" stop-color="rgba(255,51,51,0)"/>
        </linearGradient>
      </defs>
      ${grid}
      <polygon points="${area}" fill="url(#homeCryptoFill-${id})"/>
      <!-- Main spike line - BRIGHT RED -->
      <polyline points="${spikePoints}" fill="none" stroke="#ff3333" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="miter" stroke-linecap="butt"/>
      <!-- Spike tips for extra visibility -->
      <g stroke="#ff3333" stroke-width="1" fill="#ff3333">
        ${sampled.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.v)}" r="1.5"/>`).join('')}
      </g>
      <!-- Current price marker -->
      <circle cx="${x(sampled.length-1)}" cy="${y(last.v)}" r="6" fill="#ff3333" stroke="#070707" stroke-width="2"/>
      ${el.getAttribute('data-fallback') === 'true' ? `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="rgba(255,51,51,.6)" font-size="10" font-family="var(--font-mono)" font-weight="600">DEMO DATA</text>` : `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="rgba(0,255,128,.6)" font-size="10" font-family="var(--font-mono)" font-weight="600" style="opacity:0.5;">LIVE DATA</text>`}
      <text x="8" y="${H-7}" fill="rgba(241,236,225,.35)" font-size="9" font-family="var(--font-mono)">${new Date(sampled[0].t).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</text>
      <text x="${W-8}" y="${H-7}" text-anchor="end" fill="rgba(241,236,225,.35)" font-size="9" font-family="var(--font-mono)">${new Date(last.t).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</text>
    </svg>`;
    // Show status indicator if using fallback
    const statusEl=document.getElementById(`home-crypto-chart-status-${id}`);
    if(statusEl) statusEl.style.display=el.getAttribute('data-fallback')?'block':'none';
  }

  function updateConverter(id,source){
    const s=state[id];
    if(!s.price || s.updating) return;
    const crypto=document.getElementById(`home-${id}-crypto`);
    const inr=document.getElementById(`home-${id}-inr`);
    if(!crypto || !inr) return;
    s.updating=true;
    if(source==='crypto') inr.value=(Number(crypto.value||0)*s.price).toFixed(2);
    else crypto.value=(Number(inr.value||0)/s.price).toFixed(8).replace(/0+$/,'').replace(/\.$/,'');
    s.updating=false;
  }

  async function loadCoin(c){
    const priceEl=document.getElementById(`home-${c.id}-price`);
    const changeEl=document.getElementById(`home-${c.id}-change`);
    const chartEl=document.getElementById(`home-crypto-chart-${c.id}`);
    if(!priceEl || !changeEl || !chartEl) return;

    chartEl.innerHTML='<div class="home-crypto-loading">LOADING LIVE DATA...</div>';

    async function fetchJson(url, attempts=3){
      let lastError;
      for(let attempt=0; attempt<attempts; attempt++){
        try{
          const res=await fetch(url,{cache:'no-store', mode:'cors'});
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        }catch(err){
          lastError=err;
          if(attempt < attempts-1){
            await new Promise(r=>setTimeout(r,700*(attempt+1)));
          }
        }
      }
      throw lastError || new Error('Request failed');
    }

    // Try API with proxy fallback for CORS issues
    async function fetchJsonWithProxy(url, attempts=3){
      try{
        return await fetchJson(url, attempts);
      }catch(e){
        // Try via allorigins proxy if direct fails
        const proxyUrl=`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        try{
          return await fetchJson(proxyUrl, 2);
        }catch(e2){
          throw e; // throw original error
        }
      }
    }

    // Fallback: generate sample chart data if API fails (for demo purposes)
    function generateFallbackChart(id){
      const now=Date.now();
      const basePrices={bitcoin:5800000,ethereum:320000,solana:14000}; // INR
      const base=basePrices[id]||1000;
      const points=[];
      for(let i=0;i=96;i++){
        // 15-min intervals over 24h with realistic volatility
        const t=now-24*60*60*1000+i*15*60*1000;
        const variation=(Math.sin(i*0.3)+Math.random()*0.5)*0.02; // ±2% variation
        points.push([t,Math.round(base*(1+variation))]);
      }
      return points;
    }

    try{
      /* Load market data and chart independently so one endpoint
         failing does not break the entire crypto card. */
      const market=(
        await fetchJsonWithProxy(
          `${apiBase}/coins/markets?vs_currency=inr&ids=${c.id}&price_change_percentage=24h`
        )
      )[0];

      if(!market) throw new Error('Coin not found');

      state[c.id].price=Number(market.current_price);
      priceEl.textContent=`₹${fmtINR(state[c.id].price)}`;

      const change=Number(market.price_change_percentage_24h)||0;
      changeEl.textContent=`${change>=0?'+':'−'}${Math.abs(change).toFixed(2)}% / 24H`;
      changeEl.className=`home-crypto-change ${change>=0?'positive':'negative'}`;

      updateConverter(c.id,'crypto');

      try{
        const chart=await fetchJsonWithProxy(
          `${apiBase}/coins/${c.id}/market_chart?vs_currency=inr&days=1&interval=hourly`
        );
        drawChart(c.id,chart.prices||[], false); // Real API data
      }catch(chartErr){
        console.error(`Chart request failed for ${c.id}:`,chartErr);
        // Use fallback data so chart always shows
        const fallback=generateFallbackChart(c.id);
        drawChart(c.id,fallback, true); // Fallback data
      }

    }catch(err){
      console.error(`Market request failed for ${c.id}:`,err);
      changeEl.textContent='MARKET DATA UNAVAILABLE';
      changeEl.className='home-crypto-change negative';
      // Still try to show chart with fallback data
      const fallback=generateFallbackChart(c.id);
      drawChart(c.id,fallback, true); // Fallback data
    }
  }

  coins.forEach(c=>{
    const crypto=document.getElementById(`home-${c.id}-crypto`);
    const inr=document.getElementById(`home-${c.id}-inr`);
    if(crypto) crypto.addEventListener('input',()=>updateConverter(c.id,'crypto'));
    if(inr) inr.addEventListener('input',()=>updateConverter(c.id,'inr'));
  });

  Promise.all(coins.map(loadCoin));
}

function ProjectTile(p,i){
  const links=(p.links||'').split(',').map(s=>s.trim()).filter(Boolean).map(pair=>{
    const [label,url]=pair.split('|').map(s=>(s||'').trim());
    return url ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="link-btn mono">${esc(label||'LINK')} ↗</a>` : '';
  }).join(' ');
  return `<article class="project-tile">
    <div class="mono project-tile-num">${String(i+1).padStart(2,'0')}</div>
    <div class="mono project-tile-status">${esc(p.status||'PROJECT')}</div>
    <h3>${esc(p.title)}</h3>
    <p>${esc(p.description||'')}</p>
    ${p.teamMembers ? `<div class="mono project-tile-meta">${esc(p.teamMembers)}</div>` : ''}
    ${links ? `<div style="margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;">${links}</div>` : ''}
  </article>`;
}

async function BlogDetailPage(params){
  const blog = await blogService.getById(params.id);

  const contentHtml = (typeof marked !== 'undefined' && blog.content) ? marked.parse(blog.content) : `<p>${esc(blog.content||'')}</p>`;

  const hasAttachment = blog.attachment && blog.attachment.startsWith('data:');
  const attachmentName = blog.attachment_name || 'Attachment';
  const attachmentType = blog.attachment_type || '';
  const isImage = attachmentType.startsWith('image/');
  const isPdf = attachmentType === 'application/pdf' || attachmentName.toLowerCase().endsWith('.pdf');

  return `${NavBar('#/blogs')}
  <div class="page-head">
    <div class="container">
      <a href="#/blogs" class="link-btn mono">← ALL ARTICLES</a>
      <div class="eyebrow mono" style="margin-top:22px;">${esc(blog.category||'ARTICLE')}</div>
      <h1 style="font-size:clamp(28px,4.6vw,46px);">${esc(blog.title)}</h1>
      <p class="mono text-dim" style="margin-top:14px;font-size:12px;">${esc(blog.author||'')} — ${fmtDate(blog.createdAt)}</p>
    </div>
  </div>
  <section class="section">
    <div class="container">
      ${blog.coverImage ? `<img src="${esc(blog.coverImage)}" alt="${esc(blog.title)}" style="width:100%;border:1px solid var(--border);margin-bottom:48px;max-height:440px;object-fit:cover;">` : ''}
      <div class="prose">${contentHtml}</div>
      ${hasAttachment ? `
        <div style="margin-top:48px;padding:24px;border:1px solid var(--border);border-radius:8px;background:var(--bg-alt);">
          <h3 style="font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px;color:var(--text-dim);">Attachment</h3>
          ${isImage ? `
            <img src="${esc(blog.attachment)}" alt="${esc(attachmentName)}" style="max-width:100%;max-height:500px;border:1px solid var(--border);border-radius:4px;">
          ` : isPdf ? `
            <div style="display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:4px;">
              <span style="font-size:28px;color:var(--accent);">📄</span>
              <div>
                <div style="font-family:var(--font-mono);font-size:13px;color:var(--text);">${esc(attachmentName)}</div>
                <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">PDF Document</div>
              </div>
            </div>
            <iframe src="${esc(blog.attachment)}" style="width:100%;height:600px;border:1px solid var(--border);border-radius:4px;margin-top:16px;"></iframe>
          ` : `
            <div style="display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:4px;">
              <span style="font-size:28px;">📎</span>
              <div>
                <div style="font-family:var(--font-mono);font-size:13px;color:var(--text);">${esc(attachmentName)}</div>
                <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">File attachment</div>
              </div>
              <a href="${esc(blog.attachment)}" download="${esc(attachmentName)}" class="btn btn-outline btn-sm" style="margin-left:auto;">Download</a>
            </div>
          `}
        </div>
      ` : ''}
    </div>
  </section>
  `;
}

async function AdminUsersPage(){
  const user = await authService.currentUser();
  if(user?.role !== 'super_admin') return adminShell(EmptyState({title:'Super Admin only',msg:'Only the Super Admin can grant or revoke admin access.'}), 'users');
  const users = await adminUsersService.getAll();

  // If no users exist, show super admin creation form
  if(users.length === 0){
    return adminShell(`
      <div class="admin-topbar"><h1>Admin Access — Initial Setup</h1></div>
      <div class="admin-role-note"><strong>NO ADMIN USERS EXIST</strong> — Create the first Super Admin account.</div>
      <form id="super-admin-create-form" class="admin-form" style="max-width:500px;">
        <div class="field"><label>Name</label><input name="name" required placeholder="Your name"></div>
        <div class="field"><label>Email</label><input type="email" name="email" required placeholder="admin@club.edu"></div>
        <div class="field"><label>Password</label><input type="password" name="password" required placeholder="At least 4 characters" minlength="4"></div>
        <button class="btn btn-primary" type="submit">CREATE SUPER ADMIN</button>
      </form>
    `, 'users');
  }

  return adminShell(`
    <div class="admin-topbar"><h1>Admin Access</h1></div>
    <div class="admin-role-note"><strong>SUPER ADMIN</strong> can invite editors/admins and revoke access. Admin users are created by the super admin — no public signup.</div>
    <form id="admin-user-form" class="admin-form">
      <div class="form-row-2">
        <div class="field"><label>Name</label><input name="name" required placeholder="Club member"></div>
        <div class="field"><label>Email</label><input type="email" name="email" required placeholder="member@club.edu"></div>
      </div>
      <div class="field"><label>Password</label><input type="password" name="password" required placeholder="At least 4 characters" minlength="4"></div>
      <div class="field"><label>Role</label><select name="role"><option value="admin">Admin — manage content</option><option value="editor">Editor — create/edit content</option><option value="viewer">Viewer — read-only</option></select></div>
      <button class="btn btn-primary" type="submit">+ CREATE ADMIN USER</button>
    </form>
    <div class="admin-table-wrap" style="margin-top:34px;"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>
      ${users.map(u=>`<tr><td>${esc(u.name||'—')}</td><td>${esc(u.email)}</td><td><span class="badge ${u.role==='super_admin'?'published':'draft'} mono">${esc(u.role)}</span></td><td>${esc(u.status||'active')}</td><td>${u.role!=='super_admin'?`<button class="link-btn danger mono" data-action="revoke-admin" data-id="${u.id}">REVOKE</button>`:'<span class="mono">OWNER</span>'}</td></tr>`).join('')}
    </tbody></table></div>

function bindContactDetailsForm(){
  const form=document.getElementById('contact-details-form'); if(!form) return;
  form.addEventListener('submit',async e=>{e.preventDefault(); await contactService.update(Object.fromEntries(new FormData(form).entries())); showToast('Contact details saved.');});
}
function bindAdminUserForm(){
  const form=document.getElementById('admin-user-form');
  if(!form) return;
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const data=Object.fromEntries(new FormData(form).entries());
    const res = await authService.createAdminUser(data.email, data.password, data.name, data.role);
    if(res.ok){
      showToast('Admin user created.');
      location.hash='#/admin/users';
    } else {
      showToast(res.error);
    }
  });

  // Handle super admin creation form (initial setup)
  const superForm = document.getElementById('super-admin-create-form');
  if(superForm){
    superForm.addEventListener('submit',async e=>{
      e.preventDefault();
      const data=Object.fromEntries(new FormData(superForm).entries());
      const res = await authService.createSuperAdmin(data.email, data.password, data.name);
      if(res.ok){
        showToast('Super admin created. Please log in.');
        location.hash='#/admin/login';
      } else {
        showToast(res.error);
      }
    });
  }
}

function renderField(f, value, item){
  const val = value ?? '';
  const req = f.required ? 'required' : '';
  if(f.type === 'textarea'){
    return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><textarea name="${f.key}" ${req} placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea></div>`;
  }
  if(f.type === 'markdown'){
    return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><textarea name="${f.key}" ${req} rows="12" class="mono-area" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>${f.hint?`<div class="field-hint">${esc(f.hint)}</div>`:''}</div>`;
  }
  if(f.type === 'select'){
    return `<div class="field"><label>${esc(f.label)}</label><select name="${f.key}">
      ${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select></div>`;
  }
  if(f.type === 'date'){
    return `<div class="field"><label>${esc(f.label)}</label><input type="date" name="${f.key}" value="${esc(val)}" ${req} class="admin-date-input"></div>`;
  }
  if(f.type === 'file'){
    const isDataURL = val && val.startsWith('data:');
    const fileName = item ? item[`${f.key}_name`] : (isDataURL ? 'Attached file' : val);
    const fileType = (item && item[`${f.key}_type`]) || '';
    const isImage = fileType.startsWith('image/');
    const isPdf = fileType === 'application/pdf' || (fileName && fileName.toLowerCase().endsWith('.pdf'));

    let previewHtml = '';
    if(isDataURL){
      if(isImage){
        previewHtml = `<div style="margin-top:12px;"><img src="${esc(val)}" alt="${esc(fileName)}" style="max-width:100%;max-height:200px;border:1px solid var(--border);border-radius:4px;"></div>`;
      }else if(isPdf){
        previewHtml = `<div style="margin-top:12px;">
          <div style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:4px;">
            <span style="font-size:24px;color:var(--accent);">📄</span>
            <div>
              <div style="font-family:var(--font-mono);font-size:12px;color:var(--text);">${esc(fileName)}</div>
              <div style="font-size:11px;color:var(--text-dim);">PDF Document</div>
            </div>
          </div>
          <iframe src="${esc(val)}" style="width:100%;height:200px;border:1px solid var(--border);border-radius:4px;margin-top:8px;"></iframe>
        </div>`;
      }else{
        previewHtml = `<div style="margin-top:12px;display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:4px;">
          <span style="font-size:24px;">📎</span>
          <div style="font-family:var(--font-mono);font-size:12px;color:var(--text);">${esc(fileName)}</div>
          <a href="${esc(val)}" download="${esc(fileName)}" class="btn btn-outline btn-sm">Download</a>
        </div>`;
      }
    }
    return `<div class="field file-field"><label>${esc(f.label)}</label><input type="file" name="${f.key}" data-file-field="${f.key}"><div class="field-hint">${esc(f.hint||'')}</div>${val ? previewHtml : ''}</div>`;
  }
  return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><input type="text" name="${f.key}" value="${esc(val)}" ${req} placeholder="${esc(f.placeholder||'')}"></div>`;
}

function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function bindResourceEditor(resourceKey, id){
  const form = document.getElementById('resource-form');
  if(!form) return;
  const cfg = resourceConfigs[resourceKey];
  const statusKey = cfg.statusField || 'status';
  form.querySelectorAll('button[type=submit]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      const fileInputs = form.querySelectorAll('input[type=file][data-file-field]');
      for(const input of fileInputs){
        const file = input.files && input.files[0];
        if(file){
          const dataURL = await fileToDataURL(file);
          data[input.dataset.fileField] = dataURL;
          data[input.dataset.fileField + '_name'] = file.name;
          data[input.dataset.fileField + '_type'] = file.type;
        }else{
          delete data[input.name];
        }
      }
      if(btn.dataset.status) data[statusKey] = btn.dataset.status;
      if(id){ await cfg.service.update(id, data); showToast('Saved changes.'); }
      else { await cfg.service.create(data); showToast(`${cfg.singular} created.`); }
      location.hash = `#/admin/${resourceKey}`;
    });
  });
}

function initHomeSymbolField(){
  const canvas=document.getElementById('home-symbol-canvas');
  if(!canvas) return;

  const ctx=canvas.getContext('2d');
  if(!ctx) return;

  let W=0,H=0,dpr=1,cells=[];

  const white=['·','.','+','=','*','-','%','#',':'];
  const red=['+','*','#','%','-'];

  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(1,Math.floor(rect.width));
    H=Math.max(1,Math.floor(rect.height));

    canvas.width=Math.floor(W*dpr);
    canvas.height=Math.floor(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const cellW=13;
    const cellH=16;
    const cols=Math.ceil(W/cellW);
    const rows=Math.ceil(H/cellH);

    const copy=document.querySelector('.home-copy');
    let exclusion=null;

    if(copy){
      const c=copy.getBoundingClientRect();
      const cr=canvas.getBoundingClientRect();
      const padX=24;
      const padY=20;
      exclusion={
        left:c.left-cr.left-padX,
        right:c.right-cr.left+padX,
        top:c.top-cr.top-padY,
        bottom:c.bottom-cr.top+padY
      };
    }

    cells=[];

    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        const px=x*cellW+Math.random()*5;
        const py=y*cellH+Math.random()*5;
        if(exclusion &&
           px>=exclusion.left && px<=exclusion.right &&
           py>=exclusion.top && py<=exclusion.bottom){
          continue;
        }
        const edgeX=exclusion ? Math.min(Math.abs(px-exclusion.left),Math.abs(px-exclusion.right)) : 9999;
        const edgeY=exclusion ? Math.min(Math.abs(py-exclusion.top),Math.abs(py-exclusion.bottom)) : 9999;
        let density=.92;
        if(exclusion && (edgeX<45 || edgeY<45)) density=.70;

        if(Math.random()<density){
          const isRed=Math.random()<.028;
          cells.push({
            x:px,
            y:py,
            char:isRed
              ? red[Math.floor(Math.random()*red.length)]
              : white[Math.floor(Math.random()*white.length)],
            red:isRed,
            alpha:isRed ? .20+Math.random()*.08 : .22+Math.random()*.11
          });
        }
      }
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.font='11px "IBM Plex Mono",monospace';
    ctx.textBaseline='top';

    for(const c of cells){
      ctx.fillStyle=c.red
        ? `rgba(208,43,68,${c.alpha})`
        : `rgba(241,236,225,${c.alpha})`;
      ctx.fillText(c.char,c.x,c.y);
    }
  }

  resize();
  draw();

  window.addEventListener('resize',()=>{
    resize();
    draw();
  },{passive:true});
}

function initInlinePacketPanic(){
  const root=document.getElementById('packet-panic-game');
  if(!root) return;

  const list=root.querySelector('#packet-game-list');
  const submit=root.querySelector('#packet-submit');
  const reset=root.querySelector('#packet-reset');
  const feedback=root.querySelector('#packet-game-feedback');
  const threatCount=root.querySelector('#packet-threat-count');
  const chancesEl=root.querySelector('#packet-chances');
  const status=root.querySelector('#packet-game-status');
  const instruction=root.querySelector('#packet-game-instruction');
  const easyBtn=root.querySelector('#packet-easy');
  const hardBtn=root.querySelector('#packet-hard');

  if(!list || !submit || !reset || !easyBtn || !hardBtn) return;

  const protocols=['TLS','DNS','HTTP','TCP','HTTPS','SSH','FTP','API'];
  const packetCount=8;
  let packets=[];
  let chances=3;
  let locked=false;
  let mode='easy';

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function setMode(nextMode){
    if(nextMode===mode && packets.length) return;

    mode=nextMode;
    easyBtn.classList.toggle('active',mode==='easy');
    hardBtn.classList.toggle('active',mode==='hard');

    if(mode==='easy'){
      instruction.textContent='Easy mode: inspect packets one at a time. Click a packet and you\'ll immediately know whether you found a threat.';
      submit.style.display='none';
    }else{
      instruction.textContent='Hard mode: exactly 3 packets are threats. Select all 3 at once, then check your analysis. No packet reveals its status until you submit.';
      submit.style.display='';
      submit.textContent='CHECK 3 PACKETS';
    }

    newRound();
  }

  function newRound(){
    chances=3;
    locked=false;
    feedback.textContent='';
    feedback.className='packet-game-feedback mono';
    reset.textContent='NEW ROUND';
    const threatCountValue = mode==='hard'
      ? 3
      : 1 + Math.floor(Math.random()*3); // 1–3 threats in Easy

    const threatIndexes=new Set(
      shuffle([...Array(packetCount).keys()]).slice(0,threatCountValue)
    );

    packets=Array.from({length:packetCount},(_,i)=>({
      id:i+1,
      protocol:protocols[i],
      source:`10.0.${Math.floor(Math.random()*8)+1}.${Math.floor(Math.random()*220)+10}`,
      size:Math.floor(180+Math.random()*820),
      threat:threatIndexes.has(i),
      selected:false,
      checked:false
    }));

    threatCount.textContent=`THREATS: ${String(threatCountValue).padStart(2,'0')}`;
    chancesEl.textContent='CHANCES: 03';
    status.textContent=`${mode.toUpperCase()} // 3 CHANCES`;
    submit.disabled=false;

    render();
  }

  function render(reveal=false){
    list.innerHTML=packets.map(p=>{
      const easyCorrect=mode==='easy' && p.checked && p.threat;
      const easyWrong=mode==='easy' && p.checked && !p.threat;
      const hardSelected=mode==='hard' && p.selected;

      return `
        <button type="button"
          class="packet-game-row ${easyCorrect?'easy-correct':''} ${easyWrong?'easy-wrong':''} ${hardSelected?'hard-selected':''} ${reveal && p.threat?'reveal-threat':''} ${reveal && !p.threat?'reveal-safe':''}"
          data-packet="${p.id}"
          ${(locked || (mode==='easy' && p.checked))?'disabled':''}>
          <span><span class="packet-game-check"></span>PKT ${String(p.id).padStart(2,'0')}</span>
          <span>${p.source}</span>
          <span>${p.protocol}</span>
          <span>${p.size} B</span>
        </button>
      `;
    }).join('');

    if(!locked){
      list.querySelectorAll('.packet-game-row').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const packet=packets.find(p=>p.id===Number(btn.dataset.packet));
          if(!packet) return;

          if(mode==='easy'){
            checkEasyPacket(packet);
          }else{
            packet.selected=!packet.selected;
            render();
            updateHardSelectionFeedback();
          }
        });
      });
    }
  }

  function checkEasyPacket(packet){
    if(locked || packet.checked) return;

    packet.checked=true;

    if(packet.threat){
      feedback.textContent=`CORRECT // PKT ${String(packet.id).padStart(2,'0')} IS A THREAT`;
      feedback.className='packet-game-feedback mono good';

      const remainingThreats=packets.filter(p=>p.threat && !p.checked).length;

      if(remainingThreats===0){
        locked=true;
        render(true);
        feedback.textContent=`ROUND CLEARED // ALL ${packets.filter(p=>p.threat).length} THREATS FOUND`;
        feedback.className='packet-game-feedback mono good';
        status.textContent='EASY // ROUND CLEARED';
        reset.textContent='PLAY AGAIN';
      }else{
        status.textContent=`EASY // ${remainingThreats} THREAT${remainingThreats===1?'':'S'} LEFT`;
        render();
      }
    }else{
      chances--;
      chancesEl.textContent=`CHANCES: ${String(chances).padStart(2,'0')}`;
      feedback.textContent=`INCORRECT // PKT ${String(packet.id).padStart(2,'0')} IS SAFE`;
      feedback.className='packet-game-feedback mono bad';

      if(chances<=0){
        locked=true;
        render(true);
        const actual=packets.filter(p=>p.threat).map(p=>`PKT ${String(p.id).padStart(2,'0')}`).join(', ');
        feedback.textContent=`ROUND FAILED // THREATS WERE ${actual}`;
        feedback.className='packet-game-feedback mono bad';
        status.textContent='EASY // ROUND FAILED';
        reset.textContent='TRY AGAIN';
      }else{
        status.textContent=`EASY // ${chances} CHANCE${chances===1?'':'S'} LEFT`;
        render();
      }
    }
  }

  function updateHardSelectionFeedback(){
    const selectedCount=packets.filter(p=>p.selected).length;
    if(selectedCount===3){
      feedback.textContent='3 PACKETS SELECTED // CHECK YOUR ANALYSIS';
      feedback.className='packet-game-feedback mono';
    }else{
      feedback.textContent=`SELECT ALL 3 THREATS // ${selectedCount}/3 SELECTED`;
      feedback.className='packet-game-feedback mono';
    }
  }

  function submitHardAnalysis(){
    if(locked || mode!=='hard') return;

    const guessed=packets.filter(p=>p.selected).map(p=>p.id).sort((a,b)=>a-b);
    const actual=packets.filter(p=>p.threat).map(p=>p.id).sort((a,b)=>a-b);

    if(guessed.length!==3){
      feedback.textContent=`SELECT EXACTLY 3 PACKETS // ${guessed.length}/3 SELECTED`;
      feedback.className='packet-game-feedback mono bad';
      return;
    }

    const correct=guessed.length===actual.length &&
      guessed.every((v,i)=>v===actual[i]);

    if(correct){
      locked=true;
      render(true);
      feedback.textContent='HARD MODE CLEARED // ALL 3 THREATS FOUND AT ONCE';
      feedback.className='packet-game-feedback mono good';
      status.textContent='HARD // ROUND CLEARED';
      submit.disabled=true;
      reset.textContent='PLAY AGAIN';
      return;
    }

    chances--;
    chancesEl.textContent=`CHANCES: ${String(chances).padStart(2,'0')}`;

    if(chances<=0){
      locked=true;
      render(true);
      feedback.textContent=`ANALYSIS FAILED // THREATS WERE ${actual.map(n=>`PKT ${String(n).padStart(2,'0')}`).join(', ')}`;
      feedback.className='packet-game-feedback mono bad';
      status.textContent='HARD // ROUND FAILED';
      submit.disabled=true;
      reset.textContent='TRY AGAIN';
    }else{
      feedback.textContent=`INCORRECT // ${chances} CHANCE${chances===1?'':'S'} REMAIN`;

const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
