<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blockchain Club</title>
<meta name="description" content="MU student organization researching distributed systems, applied cryptography, and offensive & defensive security." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js">
document.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#/"]');
  if(!link || e.defaultPrevented) return;
  const href = link.getAttribute('href');
  if(!href || href === location.hash) return;
  runAsciiTransition(href);
});

</script>
<style>
  

.blockchain-demo-section{
  border-top:1px solid var(--border);
}

.blockchain-demo-intro{
  max-width:600px;
  margin-bottom:40px;
}

.blockchain-demo{
  display:grid;
  grid-template-columns:1.5fr .8fr;
  gap:40px;
  align-items:start;
}

.chain{
  display:flex;
  align-items:center;
  gap:14px;
  overflow-x:auto;
  padding:20px 0 30px;
}

.chain-block{
  flex:0 0 190px;
  padding:18px;
  border:1px solid var(--border);
  background:var(--bg-alt);
  position:relative;
  transition:
    transform .3s ease,
    border-color .3s ease;
}

.chain-block:hover{
  transform:translateY(-4px);
  border-color:var(--accent);
}

.block-top{
  display:flex;
  justify-content:space-between;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--text-faint);
}

.block-line{
  height:1px;
  background:var(--border);
  margin:14px 0;
}

.block-data{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text);
  min-height:34px;
}

.block-hash{
  margin-top:18px;
  font-size:9px;
  color:var(--accent-bright);
}

.chain-block:not(:last-child)::after{
  content:'→';
  position:absolute;
  right:-25px;
  top:50%;
  transform:translateY(-50%);
  color:var(--accent);
  font-family:'JetBrains Mono',monospace;
}

.transaction-panel{
  padding:24px;
  border:1px solid var(--border);
  background:var(--bg-alt);
}

.transaction-inputs{
  display:flex;
  align-items:center;
  gap:10px;
  margin:22px 0;
}

.transaction-inputs input{
  width:100%;
  min-width:0;
  padding:12px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  outline:none;
}

.transaction-inputs input:focus{
  border-color:var(--accent);
}

.tx-arrow{
  color:var(--accent);
  font-family:'JetBrains Mono',monospace;
}

.blockchain-status{
  margin-top:18px;
  font-size:9px;
  letter-spacing:.08em;
  color:var(--text-faint);
}

@media(max-width:800px){
  .blockchain-demo{
    grid-template-columns:1fr;
  }
}
  .selected-event{
  margin-top:16px;
  padding:16px;
  border-left:2px solid var(--accent);
  background:var(--accent-dim);
}

.selected-event-title{
  font-size:16px;
  color:var(--text);
}

.selected-event-meta{
  margin-top:7px;
  color:var(--text-faint);
  font-size:9px;
  letter-spacing:.05em;
}

.selected-event-description{
  margin-top:12px;
  color:var(--text-dim);
  font-size:13px;
  line-height:1.6;
}
  .calendar-event-dot{
  width:6px;
  height:6px;
  margin-top:10px;
  background:var(--accent);
  border-radius:50%;
}co

.calendar-details{
  padding:26px 30px;
  border-top:1px solid var(--border);
  background:rgba(255,255,255,.01);
}

.calendar-details h3{
  margin-top:10px;
  font-size:18px;
  font-weight:500;
}

.calendar-details p{
  margin-top:8px;
  color:var(--text-dim);
  font-size:13px;
  line-height:1.6;
}

.calendar-day{
  cursor:pointer;
}

.calendar-day.selected{
  background:var(--accent-dim);
}

.calendar-day.selected .calendar-number{
  color:var(--text);
}
.calendar-events{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.calendar-event{
  padding:5px 7px;
  border-left:2px solid var(--accent);
  background:var(--accent-dim);
  color:var(--text);
  font-family:var(--font-mono);
  font-size:9px;
  line-height:1.4;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
:root{
  --bg:#070707;
  --bg-alt:#0c0c0c;
  --bg-elevated:#111110;
  --text:#f1ece1;
  --text-dim:#8b8a85;
  --text-faint:#4c4b47;
  --border:#1d1d1c;
  --border-light:#2b2b29;
  --accent:#900c20;
  --accent-bright:#900c20;
  --accent-dim:#2c1216;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --container:1240px;
  --radius:2px;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-weight:400;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;margin:0;letter-spacing:-0.01em;color:var(--text);}
p{margin:0;}
a{color:inherit;text-decoration:none;}
ul{margin:0;padding:0;list-style:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:var(--font-body);}
img{max-width:100%;display:block;}
::selection{background:var(--accent);color:#fff;}
:focus-visible{outline:1.5px solid var(--accent-bright);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
}
.container{max-width:var(--container);margin:0 auto;padding:0 32px;}
.mono{font-family:var(--font-mono);}
.text-dim{color:var(--text-dim);}
.text-faint{color:var(--text-faint);}
.accent{color:var(--accent-bright);}

.eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--text-dim);display:inline-flex;align-items:center;gap:8px;
}
.eyebrow::before{content:'';width:5px;height:5px;background:var(--accent);display:inline-block;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 26px;font-family:var(--font-mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
  border:1px solid var(--border-light);border-radius:var(--radius);background:transparent;color:var(--text);
  transition:border-color .25s ease, background .25s ease, transform .25s ease, color .25s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#f7ede9;}
.btn-primary:hover{background:var(--accent-bright);border-color:var(--accent-bright);transform:translateY(-1px);}
.btn-outline:hover{border-color:var(--text-dim);transform:translateY(-1px);}
.btn-sm{padding:9px 16px;font-size:10.5px;}
.link-btn{font-size:11px;letter-spacing:.08em;color:var(--text-dim);border:none;background:none;padding:4px 0;border-bottom:1px solid transparent;}
.link-btn:hover{color:var(--text);border-color:var(--text-dim);}
.link-btn.danger:hover{color:var(--accent-bright);border-color:var(--accent-bright);}
.big-num{font-family:var(--font-display);font-weight:300;color:var(--text-faint);line-height:1;}
.divider{border:none;border-top:1px solid var(--border);margin:0;}
.badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;padding:4px 8px;border:1px solid var(--border-light);text-transform:uppercase;color:var(--text-dim);}
.badge.published{color:#c9c4b8;border-color:#3a3a37;}
.badge.draft{color:var(--text-faint);}
.status-dot{width:6px;height:6px;border-radius:50%;background:#7fae86;display:inline-block;box-shadow:0 0 6px #7fae8688;}
.status-badge{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.1em;color:var(--text-dim);}

.section{padding:100px 0;border-top:1px solid var(--border);}
.section:first-of-type{border-top:none;}
.section-head{display:flex;gap:28px;align-items:flex-start;margin-bottom:56px;}
.section-head .big-num{font-size:56px;min-width:70px;}
.section-head h2{font-size:clamp(26px,3.4vw,38px);text-transform:uppercase;letter-spacing:0.01em;}
.section-head .section-copy{color:var(--text-dim);max-width:440px;margin-top:10px;font-size:15px;}
.section-top-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;}

.nav{position:fixed;top:0;left:0;right:0;z-index:10000;border-bottom:1px solid var(--border);
  background:rgba(7,7,7,.78);backdrop-filter:blur(10px);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px;}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text);
  flex-shrink: 0;
}

.nav-logo img {
  width: 42px;
  height: 42px;
  object-fit: contain;
  display: block;
}

.brand-name {
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.nav-links{display:flex;gap:34px;align-items:center;}
.nav-link{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);position:relative;padding:4px 0;transition:color .2s;}
.nav-link::after{content:'';position:absolute;left:0;bottom:-3px;width:0;height:1px;background:var(--accent-bright);transition:width .25s ease;}
.nav-link:hover,.nav-link.active{color:var(--text);}
.nav-link:hover::after,.nav-link.active::after{width:100%;}
.nav-dropdown{position:relative;height:100%;display:flex;align-items:center;}
.nav-dropdown-toggle{border:0;background:none;color:var(--text-dim);font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 0;cursor:pointer;display:flex;align-items:center;gap:8px;}
.nav-dropdown-toggle::after{content:'';width:6px;height:6px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s ease;}
.nav-dropdown:hover .nav-dropdown-toggle,.nav-dropdown.open .nav-dropdown-toggle{color:var(--text);}
.nav-dropdown:hover .nav-dropdown-toggle::after,.nav-dropdown.open .nav-dropdown-toggle::after{transform:rotate(225deg) translate(-1px,-1px);}
.nav-dropdown-menu{position:absolute;top:calc(100% + 18px);right:-18px;width:330px;padding:10px;background:#080808;border:1px solid rgba(184,24,48,.3);box-shadow:0 24px 60px rgba(0,0,0,.48);opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .2s ease,transform .2s ease,visibility .2s ease;z-index:10001;}
.nav-dropdown-menu::before{content:'';position:absolute;top:-6px;right:28px;width:10px;height:10px;background:#080808;border-left:1px solid rgba(184,24,48,.3);border-top:1px solid rgba(184,24,48,.3);transform:rotate(45deg);}
.nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown.open .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateY(0);}
.nav-dropdown-item{display:grid;grid-template-columns:48px 1fr;gap:16px;align-items:center;padding:18px 16px;text-decoration:none;color:var(--text-dim);background:transparent;transition:background .2s ease,color .2s ease;}
.nav-dropdown-item + .nav-dropdown-item{margin-top:2px;}
.nav-dropdown-item:hover{background:rgba(143,12,32,.11);color:var(--text);}
.nav-dropdown-icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(184,24,48,.34);color:var(--accent-bright);font-size:18px;font-family:var(--font-mono);}
.nav-dropdown-title{font-family:var(--font-mono);font-size:14px;letter-spacing:.03em;color:var(--text);margin-bottom:5px;}
.nav-dropdown-desc{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--text-dim);line-height:1.5;}
.nav-toggle{display:none;flex-direction:column;gap:5px;background:none;border:none;padding:8px;}
.nav-toggle span{width:20px;height:1px;background:var(--text);display:block;}
@media (max-width:900px){
  .nav-links{position:fixed;top:72px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--border);
    flex-direction:column;gap:0;max-height:0;overflow:hidden;transition:max-height .3s ease;align-items:stretch;}
  .nav.nav-open .nav-links{max-height:760px;}
  .nav-links .nav-link{padding:16px 32px;border-top:1px solid var(--border);width:100%;}
  .nav-dropdown{display:block;height:auto;border-top:1px solid var(--border);}
  .nav-dropdown-toggle{padding:16px 32px;width:100%;justify-content:space-between;}
  .nav-dropdown-menu{position:static;width:auto;margin:0 18px 14px;box-shadow:none;transform:none;display:none;opacity:1;visibility:visible;}
  .nav-dropdown-menu::before{display:none;}
  .nav-dropdown.open .nav-dropdown-menu{display:block;}
  .nav-dropdown-item{padding:16px 14px;}
  .nav-toggle{display:flex;}
}

.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:70px;overflow:hidden;}
.network-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.4;pointer-events:none;}
.hero-inner{position:relative;z-index:2;} .hero-title::after{content:"";position:absolute;left:-10%;top:8%;width:75%;height:72%;background:radial-gradient(ellipse,rgba(144,12,32,.18),transparent 68%);filter:blur(20px);z-index:-1;pointer-events:none;}
.hero-title{font-size:clamp(38px,7.2vw,84px);text-transform:uppercase;line-height:.98;letter-spacing:-0.01em;margin:14px 0 26px;position:relative;text-shadow:0 0 34px rgba(208,43,68,.18);}
.hero-title span{display:block;}
.hero-desc{max-width:520px;color:var(--text-dim);font-size:16px;margin-bottom:36px;}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;}

.games-promo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.72fr);gap:56px;align-items:center;}
.packet-mini{border:1px solid var(--border);background:rgba(255,255,255,.015);padding:20px;min-height:230px;}
.packet-mini-head,.packet-mini-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.packet-stream{display:grid;gap:7px;margin:22px 0;min-height:108px;}
.packet-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;font:10px var(--font-mono);color:var(--text-dim);}
.packet-bar{height:5px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;}
.packet-bar span{display:block;height:100%;width:42%;background:rgba(208,43,68,.8);animation:packetMove 1.8s linear infinite;}
.packet-row.safe .packet-bar span{background:rgba(230,225,215,.28);}
.packet-mini-actions{border-top:1px solid var(--border);padding-top:14px;}
@keyframes packetMove{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media (max-width:800px){.games-promo-grid{grid-template-columns:1fr;gap:30px;}}
.games-page-card{border:1px solid var(--border);padding:34px;display:flex;justify-content:space-between;align-items:center;gap:28px;background:rgba(255,255,255,.015);}.games-page-card h2{margin:10px 0;font-size:clamp(30px,4vw,54px);}@media(max-width:700px){.games-page-card{flex-direction:column;align-items:flex-start;}}

.row-list{display:flex;flex-direction:column;}
.row-item{display:grid;grid-template-columns:60px 1fr auto;gap:20px;align-items:center;padding:26px 4px;
  border-top:1px solid var(--border);transition:padding-left .25s ease,border-color .25s ease;position:relative;}
.row-list a.row-item{border-top:1px solid var(--border);}
.row-item:last-child{border-bottom:1px solid var(--border);}
.row-item:hover{padding-left:14px;border-color:var(--border-light);}
.row-item:hover .row-arrow{transform:translateX(4px);opacity:1;}
.row-index{font-family:var(--font-mono);color:var(--text-faint);font-size:13px;}
.row-main .row-type{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--accent-bright);text-transform:uppercase;margin-bottom:6px;}
.row-main h3{font-size:19px;font-weight:500;margin-bottom:4px;}
.row-main .row-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);letter-spacing:.03em;}
.row-arrow{font-family:var(--font-mono);color:var(--text-dim);opacity:.5;transition:all .25s ease;}
@media (max-width:640px){.row-item{grid-template-columns:32px 1fr auto;}.row-main h3{font-size:16px;}}

.grid{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid > *{background:var(--bg);padding:32px;}
@media (max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.grid-3,.grid-4{grid-template-columns:1fr;}}

.img-placeholder{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;
  background:repeating-linear-gradient(135deg, var(--border) 0 1px, transparent 1px 13px), var(--bg-elevated);
  border:1px solid var(--border);}
.img-placeholder::after{content:'';position:absolute;top:10px;right:10px;width:6px;height:6px;background:var(--accent);}
.img-placeholder.portrait{aspect-ratio:3/4;}
.cover-img{width:100%;aspect-ratio:16/10;object-fit:cover;border:1px solid var(--border);}
.cover-img.portrait{aspect-ratio:3/4;}

.blog-card{border:1px solid var(--border);padding:0;display:flex;flex-direction:column;transition:border-color .25s ease;}
.blog-card:hover{border-color:var(--border-light);}
.blog-card .bc-body{padding:22px;flex:1;display:flex;flex-direction:column;gap:10px;}
.blog-card .bc-meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--accent-bright);text-transform:uppercase;}
.blog-card h3{font-size:18px;}
.blog-card p{color:var(--text-dim);font-size:13.5px;}
.blog-card .bc-foot{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-top:auto;}

.team-card{text-align:left;}
.team-card h3{font-size:17px;margin-top:16px;}
.team-card .role{font-family:var(--font-mono);font-size:11px;color:var(--accent-bright);letter-spacing:.06em;margin-top:4px;}
.team-card .dept{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.1em;text-transform:uppercase;margin-top:8px;}
.team-card p.bio{margin-top:12px;font-size:13px;color:var(--text-dim);}
.professor-section{padding-top:10px;}
.connect-subheading{font-size:11px;letter-spacing:.18em;color:var(--text-dim);margin:0 0 24px;text-transform:uppercase;}
.professor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
.professor-card{border:1px solid var(--border);padding:26px;background:rgba(255,255,255,.012);min-height:150px;}
.professor-card .professor-index{font-family:var(--font-mono);font-size:11px;color:var(--accent-bright);margin-bottom:18px;}
.professor-card h3{font-size:20px;font-weight:500;margin:0 0 8px;color:var(--text);}
.professor-card a{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);text-decoration:none;word-break:break-word;}
.professor-card a:hover{color:var(--text);}
.connect-divider{border-top:1px solid var(--border);margin:64px 0 34px;}
@media(max-width:800px){.professor-grid{grid-template-columns:1fr;}}

.wwd-item{padding:32px;}
.wwd-item .wwd-num{font-family:var(--font-mono);color:var(--accent-bright);font-size:12px;margin-bottom:14px;}
.wwd-item h3{font-size:19px;margin-bottom:10px;}
.wwd-item p{color:var(--text-dim);font-size:14px;}

.empty-state{border:1px dashed var(--border-light);padding:70px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;}
.empty-state .eyebrow{margin-bottom:4px;}
.empty-state h3{font-size:24px;text-transform:uppercase;}
.empty-state p{color:var(--text-dim);max-width:420px;font-size:14px;}

.field{margin-bottom:22px;}
.field label{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
.field input,.field textarea,.field select{
  width:100%;background:var(--bg-elevated);border:1px solid var(--border-light);color:var(--text);
  padding:13px 14px;font-size:14px;border-radius:var(--radius);transition:border-color .2s;
}
.field input::placeholder,.field textarea::placeholder{color:var(--text-faint);}

.field textarea{resize:vertical;min-height:100px;font-family:var(--font-body);}

#page-transition{
  position:fixed;
  inset:0;
  z-index:9999;
  pointer-events:none;
  visibility:hidden;
  display:grid;
  place-items:center;
  background:rgba(7,7,7,.94);
}
#page-transition .transition-art{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(520px,86vw);
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  white-space:pre;
  color:#900c20;
  font-family:var(--font-mono);
  font-size:clamp(11px,1.5vw,15px);
  line-height:1.25;
  letter-spacing:.04em;
  text-shadow:0 0 16px rgba(208,43,68,.8);
  opacity:0;
}
#page-transition .transition-label{
  position:absolute;
  left:50%;
  top:calc(50% + 115px);
  transform:translateX(-50%);
  color:#e8e4dc;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.2em;
  white-space:nowrap;
  opacity:0;
}
#page-transition.active{
  visibility:visible;
  animation:transitionIn .18s ease-out both;
}
#page-transition.active .transition-art{
  animation:asciiBuild .58s cubic-bezier(.2,.75,.25,1) both;
}
#page-transition.active .transition-label{
  animation:transitionLabel .45s ease .18s both;
}
#page-transition.reveal{
  visibility:visible;
  animation:transitionOut .42s ease .02s both;
}
@keyframes transitionIn{
  from{opacity:0}
  to{opacity:1}
}
@keyframes transitionOut{
  from{opacity:1}
  to{opacity:0;visibility:hidden}
}
@keyframes asciiBuild{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.78);filter:blur(5px)}
  45%{opacity:1;transform:translate(-50%,-50%) scale(1.02);filter:blur(0)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@keyframes transitionLabel{
  from{opacity:0;transform:translateX(-50%) translateY(5px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}

#security-loader{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#050505;
  color:#f1ece1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:var(--font-mono);
  transition:opacity .8s ease, visibility .8s ease;
}
#security-loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.security-loader-wrap{
  position:relative;
  width:min(430px,78vw);
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
}
.security-loader-ring{
  position:absolute;
  inset:-22px;
  border-radius:50%;
  background:conic-gradient(from -90deg,#900c20 0deg,#d02b44 80deg,rgba(144,12,32,.45) 180deg,rgba(144,12,32,.12) 275deg,rgba(144,12,32,.06) 330deg,#900c20 360deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  animation:loaderRing 2.6s linear infinite;
  opacity:.95;
}
.security-loader-ring::after{
  content:"";
  position:absolute;
  inset:7px;
  border-radius:50%;
  border:1px solid rgba(208,43,68,.18);
}
.security-loader-logo{
  position:relative;
  width:min(285px,58vw);
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}
.security-loader-logo::before{
  content:"";
  position:absolute;
  inset:-9px;
  border-radius:50%;
  border:1px solid rgba(241,236,225,.12);
  box-shadow:0 0 45px rgba(144,12,32,.12);
}
.security-loader-logo img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:50%;
  filter:drop-shadow(0 0 18px rgba(144,12,32,.22));
}
.security-loader-track{
  position:absolute;
  inset:-22px;
  border-radius:50%;
  border:1px solid rgba(241,236,225,.09);
  pointer-events:none;
}
.security-loader-dot{
  position:absolute;
  top:50%;
  left:50%;
  width:8px;
  height:8px;
  margin:-4px;
  border-radius:50%;
  background:#d02b44;
  box-shadow:0 0 14px rgba(208,43,68,.9);
  transform-origin:4px 4px;
  animation:loaderDot 2.6s linear infinite;
}
.security-loader-info{
  position:absolute;
  left:50%;
  bottom:-82px;
  transform:translateX(-50%);
  text-align:center;
  white-space:nowrap;
  z-index:3;
}
.security-loader-title{
  color:#f1ece1;
  font-family:var(--font-display);
  font-size:13px;
  letter-spacing:.22em;
  text-transform:uppercase;
}
.security-loader-status{
  margin-top:10px;
  color:#77746e;
  font-size:9px;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.security-loader-progress{
  width:130px;
  height:2px;
  margin:13px auto 0;
  background:#1b1b1b;
  overflow:hidden;
}
.security-loader-progress-fill{
  width:0%;
  height:100%;
  background:#900c20;
  box-shadow:0 0 12px rgba(208,43,68,.8);
  transition:width .2s linear;
}
@keyframes loaderRing{to{transform:rotate(360deg)}}
@keyframes loaderDot{
  from{transform:rotate(0deg) translateX(min(215px,39vw))}
  to{transform:rotate(360deg) translateX(min(215px,39vw))}
}
@media(max-width:600px){
  .security-loader-wrap{width:62vw}
  .security-loader-ring,.security-loader-track{inset:-16px}
  .security-loader-logo{width:54vw}
  .security-loader-info{bottom:-68px}
}

.packet-game-row.easy-wrong{

  background:rgba(144,12,32,.08);
  opacity:.68;
}

.packet-game-row.hard-selected{
  border-color:rgba(208,43,68,.72);
  background:rgba(144,12,32,.09);
  color:var(--text);
}

  font-size:9px;
  letter-spacing:.1em;
}

.packet-game-list{
  display:grid;
  gap:7px;
  margin:16px 0 20px;
}

  width:100%;

  grid-template-columns:74px 1fr 72px 82px;
  gap:10px;
  align-items:center;
  padding:11px 12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.012);
  color:var(--text-dim);
  text-align:left;
  font-family:var(--font-mono);
  font-size:10px;
  cursor:pointer;
  transition:border-color .2s ease,background .2s ease,transform .2s ease;
}

.packet-game-row:hover{
  border-color:rgba(241,236,225,.28);
  transform:translateX(3px);
}

.packet-game-row.selected{
  border-color:rgba(208,43,68,.72);
  background:rgba(144,12,32,.09);
  color:var(--text);
}

.packet-game-row.reveal-threat{
  border-color:rgba(208,43,68,.6);
  background:rgba(144,12,32,.12);
}

.packet-game-row.reveal-safe{
  opacity:.58;
}

.packet-game-check{
  width:12px;
  height:12px;
  border:1px solid rgba(241,236,225,.28);
  display:inline-block;
  margin-right:7px;
  vertical-align:-2px;
}

.packet-game-row.selected .packet-game-check{
  background:var(--accent);
  border-color:var(--accent-bright);
}

  flex-wrap:wrap;
}

  font-size:10px;
}

}

.packet-game-feedback.bad{color:rgba(208,43,68,.85);}

.packet-panic-home{
  display:block;

    linear-gradient(135deg,rgba(255,255,255,.025),transparent 55%),
    var(--bg-alt);

  min-height:300px;
  transition:
    transform .45s cubic-bezier(.22,1,.36,1),
    border-color .45s ease,
    background .45s ease;
}

  border-color:rgba(144,12,32,.65);

    linear-gradient(135deg,rgba(144,12,32,.06),transparent 60%),
    var(--bg-alt);
}

.packet-panic-bottom{

}

  color:var(--text-faint);

}

  gap:8px;
  margin:24px 0;
}

.packet-panic-line{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  align-items:center;
  padding:10px 12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.012);
  color:var(--text-faint);
  font-size:10px;
  transition:transform .3s ease, background .3s ease;
}

.packet-panic-line:hover{
  transform:translateX(5px);
  background:rgba(255,255,255,.025);
}

.packet-panic-line span:last-child{
  text-align:right;
}

.packet-panic-line.threat span:last-child{
  color:rgba(208,43,68,.72);
}

.packet-safe{
  color:rgba(241,236,225,.42);
}

.packet-panic-bottom{
  padding-top:17px;

}

  font-size:17px;
  transition:transform .3s ease;
}

  transform:translateX(6px);
}

/* NAVIGATION */
.nav-link,
.nav-dropdown-toggle{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  padding:11px 14px;
  transition:color .25s ease;

.nav-link::after{
  content:"";
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:var(--hover-red);
  transform:translateX(-102%);
  transition:transform .32s cubic-bezier(.2,.75,.2,1);
  z-index:-1;
}
.nav-link:hover::after,
.nav-link.active::after{transform:translateX(0);}
.nav-link:hover,
.nav-link.active{color:#fff!important;}
.nav-dropdown-toggle::before{

/* CALENDAR */

.calendar-day::before{
  content:"";

  content:"";

  inset:0;
  background:var(--hover-red);
  transform:scaleX(0);
  transform-origin:left;

/* TEXT LINKS */

  transition:color .2s ease!important;

.professor-card a:hover::after{right:0;}

}
@media(max-width:800px){
  .contact-outlook-full{
    font-size:20px !important;
    line-height:1.25 !important;
  }
}
</style>


<style id="contact-membership-questionnaire">
.contact-question{
  margin:0 0 28px;
}

.contact-question > label,
.contact-choice-group > legend{
  display:block;
  margin:0 0 11px;
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  font-weight:500;
}

.question-number{
  color:var(--accent-bright);
  margin-right:5px;
  font-family:var(--font-mono);
}

.contact-question input[type="text"],
.contact-question input[type="email"],
.contact-question input:not([type]),
.contact-question textarea{
  width:100%;
  box-sizing:border-box;
}

.contact-question input,
.contact-question textarea{
  background:rgba(255,255,255,.025) !important;
  border:1px solid var(--border) !important;
  color:var(--text) !important;
  padding:13px 14px !important;
  font:13px var(--font-sans) !important;
  outline:none;
  transition:border-color .2s ease, background .2s ease;
}

.contact-question input::placeholder,
.contact-question textarea::placeholder{
  color:var(--text-dim);
}

.contact-question input:focus,
.contact-question textarea:focus{
  border-color:var(--accent) !important;
  background:rgba(255,255,255,.04) !important;
}

.contact-choice-group{
  border:0;
  padding:0;
  min-width:0;
}

.contact-choice{
  display:flex !important;
  align-items:center;
  gap:12px;
  margin:0 0 15px;
  color:var(--text-dim) !important;
  font-size:13px !important;
  cursor:pointer;
}

.contact-choice input{
  appearance:none;
  -webkit-appearance:none;
  width:20px !important;
  height:20px !important;
  min-width:20px;
  padding:0 !important;
  border:1px solid var(--text-dim) !important;
  background:transparent !important;
  cursor:pointer;
  position:relative;
}

.contact-choice input[type="checkbox"]:checked,
.contact-choice input[type="radio"]:checked{
  border-color:var(--accent) !important;
  background:var(--accent) !important;
}

.contact-choice input[type="checkbox"]:checked::after{
  content:"✓";
  position:absolute;
  left:4px;
  top:0px;
  color:#fff;
  font-size:13px;
}

.contact-choice input[type="radio"]{
  border-radius:50%;
}

.contact-choice input[type="radio"]:checked::after{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
  left:5px;
  top:5px;
}

.contact-choice span{
  color:var(--text-dim);
}

.contact-choice:hover span{
  color:var(--text);
}

@media(max-width:800px){
  .contact-question{
    margin-bottom:24px;
  }

  .contact-question > label,
  .contact-choice-group > legend{
    font-size:13px;
  }
}
</style>


<style id="club-about-section">
.club-about-section{
  margin-top:72px;
  padding-top:32px;
  border-top:1px solid var(--border);
  max-width:100%;
}

.club-about-kicker{
  color:var(--accent-bright);
  font-size:12px;
  letter-spacing:.16em;
  margin-bottom:20px;
}

.club-about-section p{
  max-width:980px;
  margin:0;
  color:var(--text-dim);
  font-size:16px;
  line-height:1.8;
}

.club-about-tagline{
  margin-top:28px !important;
  color:var(--text) !important;
  font-size:17px !important;
}

@media(max-width:800px){
  .club-about-section{
    margin-top:48px;
    padding-top:26px;
  }

  .club-about-section p{
    font-size:14px;
    line-height:1.75;
  }

  .club-about-tagline{
    font-size:15px !important;
  }
}
</style>


<style id="club-join-member-button">
.club-join-member{
  display:inline-flex;
  margin-top:34px;
  min-width:220px;
  justify-content:center;
  text-decoration:none !important;
}
@media(max-width:800px){
  .club-join-member{
    width:100%;
    box-sizing:border-box;
    margin-top:28px;
  }
}
</style>


<style id="club-socials-compact-row">
.club-social-links{
  display:grid !important;
  grid-template-columns:repeat(4,minmax(0,1fr)) !important;
  gap:10px !important;
  border:0 !important;
  width:100%;
}

.club-social-link{
  min-height:0 !important;
  height:108px !important;
  box-sizing:border-box;
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
  gap:8px !important;
  padding:12px 8px !important;
  border:1px solid var(--border) !important;
  background:var(--bg);
  text-align:center;
}

.club-social-icon-wrap{
  width:42px !important;
  height:42px !important;
  flex:0 0 42px !important;
}

.club-social-icon{
  width:23px !important;
  height:23px !important;
}

.club-social-copy{
  display:block !important;
}

.club-social-copy small{
  display:block;
  font-size:9px !important;
  line-height:1.1 !important;
  letter-spacing:.1em !important;
}

.club-social-arrow{
  position:absolute;
  top:7px;
  right:9px;
  margin:0 !important;
  font-size:12px !important;
}

.hero-cta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.hero-cta .btn{
  white-space:nowrap;
}

@media(max-width:700px){
  .club-social-links{
    grid-template-columns:repeat(4,minmax(0,1fr)) !important;
    gap:6px !important;
  }

  .club-social-link{
    height:88px !important;
    padding:8px 4px !important;
  }

  .club-social-icon-wrap{
    width:34px !important;
    height:34px !important;
    flex-basis:34px !important;
  }

  .club-social-icon{
    width:19px !important;
    height:19px !important;
  }

  .club-social-copy small{
    font-size:7px !important;
    letter-spacing:.06em !important;
  }

  .club-social-arrow{
    display:none;
  }
}

@media(max-width:380px){
  .club-social-links{
    gap:4px !important;
  }

  .club-social-link{
    height:82px !important;
  }

  .club-social-copy small{
    font-size:6.5px !important;
  }
}
</style>


<style id="membership-scroll-target">
#membership-form{
  scroll-margin-top:110px;
}
</style>


<style id="membership-direct-open">
#membership-form{
  scroll-margin-top:90px;
}
</style>

</head>

function getTransitionKey(path){
  const clean = String(path || '').replace(/^#\/?/, '').split('/')[0];
  return ASCII_TRANSITIONS[clean] ? clean : 'games';
}

function runAsciiTransition(path, done){
  const overlay = document.getElementById('ascii-transition');
  const art = document.getElementById('ascii-art');
  const label = document.getElementById('ascii-label');
  if(!overlay || !art || !label){
    if(done) done();
    return;
  }

  const config = ASCII_TRANSITIONS[getTransitionKey(path)];
  art.textContent = config.art.join('\n');
  label.textContent = '→ ' + config.label + ' →';

  overlay.classList.add('active');
  overlay.setAttribute('aria-hidden','false');

  setTimeout(() => {
    if(done) done();
  }, 1050);

  setTimeout(() => {
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden','true');
  }, 650);
}

const store = {
  async get(key, shared = true){
    try{
      const r = await window.storage.get(key, shared);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  },
  async set(key, value, shared = true){
    try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
    catch(e){ console.error('storage.set failed', e); return false; }
  },
  async remove(key, shared = true){
    try{ await window.storage.delete(key, shared); return true; }
    catch(e){ return false; }
  }
};

function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(ts){
  if(!ts) return '—';
  const d = typeof ts === 'number' ? new Date(ts) : new Date(ts);
  if(isNaN(d.getTime())) return esc(ts);
  return d.toLocaleDateString('en-US',{ day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
}

function initBlockchainDemo(){

  const chain = document.getElementById('demo-chain');
  const button = document.getElementById('add-block-btn');
  const fromInput = document.getElementById('tx-from');
  const toInput = document.getElementById('tx-to');
  const status = document.getElementById('blockchain-status');

  if(!chain || !button) return;

  let blockNumber = 0;

  button.addEventListener('click', () => {

function makeCollectionService(key){
  return {
    async getAll(){ return (await store.get(key)) || []; },
    async getPublished(){ return (await this.getAll()).filter(i => i.status === 'published'); },
    async getById(id){ return (await this.getAll()).find(i => i.id === id) || null; },
    async create(data){
      const list = await this.getAll();
      const item = { ...data, id: uid(), status: data.status || 'draft', createdAt: Date.now(), updatedAt: Date.now() };
      list.unshift(item);
      await store.set(key, list);
      return item;
    },
    async update(id, patch){
      const list = await this.getAll();
      const idx = list.findIndex(i => i.id === id);
      if(idx === -1) return null;
      list[idx] = { ...list[idx], ...patch, updatedAt: Date.now() };
      await store.set(key, list);
      return list[idx];
    },
    async delete(id){
      const list = (await this.getAll()).filter(i => i.id !== id);
      await store.set(key, list);
      return true;
    }
  };
}
function makeSingletonService(key, defaults){
  return {
    async get(){ const v = await store.get(key); return v || defaults; },
    async update(patch){
      const current = await this.get();
      const merged = { ...current, ...patch };
      await store.set(key, merged);
      return merged;
    }
  };
}

  async login(email, password){
    if(!email || !password) return { ok:false, error:'Email and password are required.' };
    if(password.length < 4) return { ok:false, error:'Incorrect email or password.' };
    let users = await adminUsersService.getAll();
    let user = users.find(u => String(u.email).toLowerCase() === String(email).toLowerCase() && u.status !== 'disabled');
    if(!users.length){
      user = await adminUsersService.create({
        email,
        name: email.split('@')[0],
        role:'super_admin',
        status:'active'
      });
    } else if(!user){
      return { ok:false, error:'This account has not been invited to the admin panel.' };

    await store.set('bcc:session', {
      email:user.email,
      name:user.name,
      role:user.role,
      loggedInAt: Date.now()
    }, false);
    return { ok:true, user };
  },
  async logout(){ await store.remove('bcc:session', false); },
  async isAuthenticated(){ return !!(await store.get('bcc:session', false)); },

function compilePattern(pattern){
  const paramNames = [];
  const regexStr = '^' + pattern.replace(/:[^/]+/g, m => { paramNames.push(m.slice(1)); return '([^/]+)'; }) + '$';
  return { regex: new RegExp(regexStr), paramNames };
}

function parseHash(){
  let h = location.hash.slice(1);
  if(!h) h = '/';
  if(h.length > 1 && h.endsWith('/')) h = h.slice(0, -1);
  return h;
}
function matchRoute(path){
  for(const route of routes){
    const m = path.match(route.regex);
    if(m){
      const params = {};
      route.paramNames.forEach((name,i) => params[name] = decodeURIComponent(m[i+1]));
      return { route, params };
    }
  }
  return null;
}

function transitionKey(path){
  const p = String(path || '/').replace(/^\//,'').split('/').filter(Boolean).map(x => x.toLowerCase());

  if(!p.length) return 'home';
  if(p[0] === 'admin') return 'admin';

  /* Connect gets the original ASCII tree. */
  if(p[0] === 'team') return 'connect';
  if(p[0] === 'contact'){
    if(sessionStorage.getItem('joinMemberTransition') === '1'){
      sessionStorage.removeItem('joinMemberTransition');
      return 'joinMember';
    }
    return 'contact';
  }

  /* Projects and Games are Labs sub-pages, so give each its own artwork. */
  if(p[0] === 'labs' && p[1] === 'projects') return 'projectsLab';
  if(p[0] === 'labs' && p[1] === 'games') return 'gamesLab';

  if(p[0] === 'courses' || p[0] === 'resources') return 'resources';

  return TRANSITION_ART[p[0]] ? p[0] : 'home';
}

function startPageTransition(path){
  if(firstPageLoad || path === '/') return;

  const transition = document.getElementById('page-transition');
  if(!transition) return;

  const art = document.getElementById('transition-art');
  const label = document.getElementById('transition-label');
  const key = transitionKey(path);

  if(art) art.textContent = TRANSITION_ART[key];
  if(label){
    const transitionLabels = {
      connect: 'BLOCKCHAIN CLUB // CONNECT',
      contact: 'BLOCKCHAIN // CONNECT // CONTACT',
      joinMember: 'BLOCKCHAIN // CLUB // JOIN AS A MEMBER',
      projectsLab: 'BLOCKCHAIN // LABS // PROJECT',
      gamesLab: 'BLOCKCHAIN // LABS // GAMES',
      resources: 'BLOCKCHAIN CLUB // RESOURCES'
    };
    label.textContent = transitionLabels[key] || `BLOCKCHAIN CLUB // ${key.toUpperCase()}`;
  }

  transition.classList.remove('reveal');
  void transition.offsetWidth;
  transition.classList.add('active');

  clearTimeout(transitionTimer);
}

function endPageTransition(){
  const transition = document.getElementById('page-transition');
  if(!transition || firstPageLoad) return;

  transition.classList.remove('active');
  transition.classList.add('reveal');

  transitionTimer = setTimeout(() => {
    transition.classList.remove('reveal');
  }, 1200);
}

async function render(){
  const path = parseHash();
  startPageTransition(path);

  const found = matchRoute(path);
  const app = document.getElementById('app');
  if(!found){
    app.innerHTML = `<div class="page-fade">${NotFoundPage()}</div>`;
    endPageTransition();
    firstPageLoad = false;
    return;
  }

  const { route, params } = found;
  if(route.admin && !route.skipGuard){
    const authed = await authService.isAuthenticated();
    if(!authed){ location.hash = '#/admin/login'; return; }
  }

  let html;
  try{ html = await route.view(params); }
  catch(e){ console.error(e); html = NotFoundPage(); }

  app.innerHTML = `<div class="page-fade">${html}${route.admin ? '' : SiteFooter()}</div>`;
  window.scrollTo(0,0);

  if(route.after) route.after(params);
  initGlobalWidgets(path);
  initHomeSymbolField();
  initChallengeGame();
  initInlinePacketPanic();
  if(path === '/') initHomeCrypto();

  if(path === '/events'){
    initCalendar();
  }

  if(!firstPageLoad && path !== '/'){
    requestAnimationFrame(() => setTimeout(endPageTransition, 1350));
  }

  firstPageLoad = false;
}

  const state={};
  coins.forEach(c=>state[c.id]={price:null,updating:false});

  const fmtINR=n=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format(Number(n)||0);

  function drawChart(id,prices){
    const el=document.getElementById(`home-crypto-chart-${id}`);
    if(!el) return;
    const data=(prices||[]).filter(p=>Array.isArray(p)&&p.length>=2).map(p=>({t:p[0],v:Number(p[1])})).filter(p=>Number.isFinite(p.v));
    if(data.length<2){
      el.innerHTML='<div class="home-crypto-loading">NO CHART DATA</div>';
      return;
    }
    const W=760,H=250,left=8,right=8,top=12,bottom=24;
    const min=Math.min(...data.map(d=>d.v));
    const max=Math.max(...data.map(d=>d.v));
    const span=(max-min)||1;
    const x=i=>left+(i/(data.length-1))*(W-left-right);
    const y=v=>top+(1-(v-min)/span)*(H-top-bottom);
    const points=data.map((d,i)=>`${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(' ');
    const area=`${left},${H-bottom} ${points} ${W-right},${H-bottom}`;
    const grid=[0,1,2,3].map(i=>{
      const gy=top+i*((H-top-bottom)/3);
      return `<line x1="${left}" x2="${W-right}" y1="${gy}" y2="${gy}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    }).join('');
    const last=data[data.length-1];
    el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${id} price fluctuation graph in Indian rupees">
      <defs><linearGradient id="homeCryptoFill-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(208,43,68,.18)"/><stop offset="100%" stop-color="rgba(208,43,68,0)"/></linearGradient></defs>
      ${grid}
      <polygon points="${area}" fill="url(#homeCryptoFill-${id})"/>
      <polyline points="${points}" fill="none" stroke="rgba(208,43,68,.9)" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
      <circle cx="${x(data.length-1)}" cy="${y(last.v)}" r="4" fill="#d02b44"/>
      <text x="8" y="${H-7}" fill="rgba(241,236,225,.35)" font-size="9" font-family="var(--font-mono)">${new Date(data[0].t).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</text>
      <text x="${W-8}" y="${H-7}" text-anchor="end" fill="rgba(241,236,225,.35)" font-size="9" font-family="var(--font-mono)">${new Date(data[data.length-1].t).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</text>
    </svg>`;
  }

  function updateConverter(id,source){
    const s=state[id];
    if(!s.price || s.updating) return;
    const crypto=document.getElementById(`home-${id}-crypto`);
    const inr=document.getElementById(`home-${id}-inr`);
    if(!crypto || !inr) return;
    s.updating=true;
    if(source==='crypto') inr.value=(Number(crypto.value||0)*s.price).toFixed(2);
    else crypto.value=(Number(inr.value||0)/s.price).toFixed(8).replace(/0+$/,'').replace(/\.$/,'');
    s.updating=false;
  }

  async function loadCoin(c){
    const priceEl=document.getElementById(`home-${c.id}-price`);
    const changeEl=document.getElementById(`home-${c.id}-change`);
    const chartEl=document.getElementById(`home-crypto-chart-${c.id}`);
    if(!priceEl || !changeEl || !chartEl) return;

    chartEl.innerHTML='<div class="home-crypto-loading">LOADING GRAPH</div>';

    async function fetchJson(url, attempts=3){
      let lastError;
      for(let attempt=0; attempt<attempts; attempt++){
        try{
          const res=await fetch(url,{cache:'no-store'});
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        }catch(err){
          lastError=err;
          if(attempt < attempts-1){
            await new Promise(r=>setTimeout(r,700*(attempt+1)));
          }
        }
      }
      throw lastError || new Error('Request failed');
    }

    try{
      /* Load market data and chart independently so one endpoint
         failing does not break the entire crypto card. */
      const market=(
        await fetchJson(
          `${apiBase}/coins/markets?vs_currency=inr&ids=${c.id}&price_change_percentage=24h`
        )
      )[0];

      if(!market) throw new Error('Coin not found');

      state[c.id].price=Number(market.current_price);
      priceEl.textContent=`₹${fmtINR(state[c.id].price)}`;

      const change=Number(market.price_change_percentage_24h)||0;
      changeEl.textContent=`${change>=0?'+':'−'}${Math.abs(change).toFixed(2)}% / 24H`;
      changeEl.className=`home-crypto-change ${change>=0?'positive':'negative'}`;

      updateConverter(c.id,'crypto');

      try{
        const chart=await fetchJson(
          `${apiBase}/coins/${c.id}/market_chart?vs_currency=inr&days=1&interval=hourly`
        );
        drawChart(c.id,chart.prices||[]);
      }catch(chartErr){
        console.error(`Chart request failed for ${c.id}:`,chartErr);
        chartEl.innerHTML='<div class="home-crypto-loading">CHART TEMPORARILY UNAVAILABLE</div>';
      }

    }catch(err){
      console.error(`Market request failed for ${c.id}:`,err);
      changeEl.textContent='MARKET DATA UNAVAILABLE';
      changeEl.className='home-crypto-change negative';
      chartEl.innerHTML='<div class="home-crypto-loading">MARKET DATA UNAVAILABLE</div>';
    }
  }

  coins.forEach(c=>{
    const crypto=document.getElementById(`home-${c.id}-crypto`);
    const inr=document.getElementById(`home-${c.id}-inr`);
    if(crypto) crypto.addEventListener('input',()=>updateConverter(c.id,'crypto'));
    if(inr) inr.addEventListener('input',()=>updateConverter(c.id,'inr'));
  });

  Promise.all(coins.map(loadCoin));
}

if(id==="phish")return `<div class="phish">${["support@metamask-alert.co","club@iiit.ac.in","security@blockchain-club.net","admin@google.com"].map((x,i)=>`<div class="mail" onclick="labPhishTry(${i})"><div class="from">FROM: ${x}</div><div class="subject">${["URGENT: Wallet verification required","Workshop registration confirmed","Your account has been flagged","Security alert: new login"][i]}</div><p>${["Connect your wallet within 10 minutes or it will be permanently locked.","Your registration for the workshop has been received.","Please review the activity in your dashboard.","We detected a new sign-in. Review the activity in your account."][i]}</p></div>`).join("")}</div><div class="status" id="lab-ps">Click the suspicious message.</div>`;
if(id==="ctf")return `<div class="terminal">$ ./challenge<br>Connecting to LAB-07...<br>Hint: look at the hex carefully.<br><br>FLAG FORMAT: BCC{...}</div><div class="choice-row">${["BCC{deadbeef}","BCC{4c4142}","BCC{block123}"].map((x,i)=>`<button class="btn" onclick="labCtfTry(${i})">${x}</button>`).join("")}</div><div class="status" id="lab-ctfs">Choose the flag you think is valid.</div>`;
if(id==="escape")return `<div class="escape"><div class="lock"><div class="label">LOCK 01</div><h3>Caesar Shift</h3><p class="text-dim">Decode: F Q E P</p><input id="lab-e1" placeholder="4 letters"><button class="btn btn-primary" onclick="labEscape1()">UNLOCK</button></div><div class="lock"><div class="label">LOCK 02</div><h3>PIN</h3><p class="text-dim">The answer to Lock 01 becomes the first clue.</p><input id="lab-e2" placeholder="PIN"><button class="btn btn-primary" onclick="labEscape2()">UNLOCK</button></div></div><div class="status" id="lab-es">Two-stage prototype.</div>`;
if(id==="trace")return `<div class="network">${["WEB","API","DB","AUTH","ADMIN","CACHE","SERVER","WALLET"].map((x,i)=>`<button class="node" onclick="labTraceTry(${i},this)">${x}<small>NODE ${i+1}</small></button>`).join("")}</div><div class="status" id="lab-ts">Three scans available.</div>`;
if(id==="packet")return `<div class="packets">${Array.from({length:16},(_,i)=>`<button class="btn" onclick="labPacketTry(this,${i%5===0})">PKT ${i+1}</button>`).join("")}</div><div class="status" id="lab-pts">Intercept the malicious packets.</div>`;
if(id==="decode")return `<div class="label">DECODE THIS</div><div class="mono-big">4C 41 42</div><div class="choice-row">${["LAB","NODE","HASH","CHAIN"].map(x=>`<button class="btn" onclick="labDecodeTry('${x}')">${x}</button>`).join("")}</div><div class="status" id="lab-ds">Choose the decoded value.</div>`;

if(id==="builder")return `<div class="game-grid">${["TRANSACTIONS","PREVIOUS HASH","TIMESTAMP","NONCE","MERKLE ROOT"].map(x=>`<button class="btn" onclick="labPartTry(this)">${x}</button>`).join("")}</div><div class="status" id="lab-bds">Select all five components.</div>`;

function labOpenGame(id){const g=LAB_GAMES.find(x=>x[0]===id),m=document.getElementById('lab-game-modal');if(!g||!m)return;labTraceScans=3;labBuilderParts=0;labVotes=0;clearInterval(labMarketTimer);document.getElementById('lab-game-modal-num').textContent=`${g[1]} / ${g[4]}`;document.getElementById('lab-game-modal-title').textContent=g[2];document.getElementById('lab-game-modal-desc').textContent=g[3];document.getElementById('lab-game-demo').innerHTML=labDemoHTML(id);m.classList.add('active');m.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}

function labHashTry(){const n=+document.getElementById('lab-hn').value;labSet('lab-ho','0000'+((n*9301+49297)%65536).toString(16).padStart(4,'0').toUpperCase());labSet('lab-hs',n===42?'✓ VALID NONCE FOUND':'Not valid — try another nonce.',n===42)}
function labChainTry(i){labSet('lab-cs',i===2?'✓ CORRUPTED BLOCK FOUND.':'Clean block. Keep looking.',i===2)}
function labPhishTry(i){labSet('lab-ps',i===0?'✓ PHISH DETECTED — suspicious domain + urgency.':'Looks less suspicious. Check the sender carefully.',i===0)}
function labCtfTry(i){labSet('lab-ctfs',i===1?'✓ FLAG ACCEPTED.':'✕ Not the flag. Look at the hex.',i===1)}
function labEscape1(){const v=document.getElementById('lab-e1').value.toUpperCase();labSet('lab-es',v==="BUCN"?'✓ LOCK 01 OPEN — next clue unlocked.':'Hint: shift each letter back by 2.',v==="BUCN")}
function labEscape2(){const v=document.getElementById('lab-e2').value;labSet('lab-es',v==="2048"?'✓ ESCAPE COMPLETE.':'Wrong PIN. Use the previous clue.',v==="2048")}
function labTraceTry(i,el){if(labTraceScans<=0)return;labTraceScans--;if(i===6){el.style.borderColor="#9bc9a5";labSet('lab-ts','✓ COMPROMISED NODE FOUND.',true);labTraceScans=0}else{el.style.opacity=".45";labSet('lab-ts',labTraceScans+" scan(s) remaining.")}}
function labPacketTry(el,bad){if(el.dataset.hit)return;el.dataset.hit=1;if(bad){el.textContent="BLOCKED";labSet('lab-pts','✓ Threat intercepted.',true)}else{el.textContent="SAFE";labSet('lab-pts','⚠ You blocked a legitimate packet.')}}
function labDecodeTry(x){labSet('lab-ds',x==="LAB"?'✓ Correct.':'✕ Incorrect.',x==="LAB")}
function labPartTry(el){if(el.dataset.used)return;el.dataset.used=1;el.style.opacity=".3";labBuilderParts++;labSet('lab-bds',labBuilderParts===5?'✓ VALID BLOCK ASSEMBLED.':labBuilderParts+" / 5 components added.",labBuilderParts===5)}
function labBuildTry(){let n=0,e=document.getElementById('lab-bn');const t=setInterval(()=>{n++;e.textContent=String(n).padStart(4,'0');if(n>=17){clearInterval(t);labSet('lab-bs','✓ BLOCK MINED AND ADDED TO THE CHAIN.',true)}},50)}
function labMarketTry(){let t=30,p1=42,p2=27;clearInterval(labMarketTimer);labMarketTimer=setInterval(()=>{t--;p1+=Math.floor(Math.random()*7)-3;p2+=Math.floor(Math.random()*7)-3;document.getElementById('lab-mp1').textContent=Math.max(5,p1);document.getElementById('lab-mp2').textContent=Math.max(5,p2);labSet('lab-ms','Simulation running — '+t+' sec remaining.',true);if(t<=0){clearInterval(labMarketTimer);labSet('lab-ms','Simulation complete.')}},1000)}
function labVote(i,el){if(el.dataset.voted)return;el.dataset.voted=1;el.style.borderColor="#9bc9a5";labVotes++;labSet('lab-vs',labVotes>=3?'✓ CONSENSUS REACHED.':labVotes+" / 3 votes needed.",labVotes>=3)}
function labAuditTry(i){labSet('lab-as',i===2?'✓ GOOD CATCH — this external call needs investigation.':'Keep looking.',i===2)}
function labWalletTry(i){labSet('lab-ws',i===1?'✓ Correct clue path. Continue the fictional puzzle.':'Try another clue.',i===1)}

function bindLoginForm(){
  const form = document.getElementById('login-form');
  if(!form) return;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = new FormData(form);
    const res = await authService.login(data.get('email'), data.get('password'));
    const errEl = document.getElementById('login-error');
    if(res.ok){ location.hash = '#/admin/dashboard'; }
    else { errEl.textContent = res.error; }
  });
}

function renderField(f, value){
  const val = value ?? '';
  const req = f.required ? 'required' : '';
  if(f.type === 'textarea'){
    return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><textarea name="${f.key}" ${req} placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea></div>`;
  }
  if(f.type === 'markdown'){
    return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><textarea name="${f.key}" ${req} rows="12" class="mono-area" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>${f.hint?`<div class="field-hint">${esc(f.hint)}</div>`:''}</div>`;
  }
  if(f.type === 'select'){
    return `<div class="field"><label>${esc(f.label)}</label><select name="${f.key}">
      ${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select></div>`;
  }
  if(f.type === 'date'){
    return `<div class="field"><label>${esc(f.label)}</label><input type="date" name="${f.key}" value="${esc(val)}" ${req}></div>`;
  }
  if(f.type === 'file'){
    return `<div class="field file-field"><label>${esc(f.label)}</label><input type="file" name="${f.key}" data-file-field="${f.key}"><div class="field-hint">${esc(f.hint||'')}</div>${val ? `<div class="field-hint">Current file: ${esc(val)}</div>` : ''}</div>`;
  }
  return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><input type="text" name="${f.key}" value="${esc(val)}" ${req} placeholder="${esc(f.placeholder||'')}"></div>`;
}

document.addEventListener('click', async (e) => {
  const navToggle = e.target.closest('[data-nav-dropdown] .nav-dropdown-toggle');
  if(navToggle){
    const dropdown=navToggle.closest('[data-nav-dropdown]');
    const isOpen=dropdown.classList.toggle('open');
    navToggle.setAttribute('aria-expanded',String(isOpen));
    document.querySelectorAll('[data-nav-dropdown].open').forEach(d=>{
      if(d!==dropdown){
        d.classList.remove('open');
        d.querySelector('.nav-dropdown-toggle')?.setAttribute('aria-expanded','false');
      }
    });
    e.preventDefault();
    return;
  }
  if(!e.target.closest('[data-nav-dropdown]')){
    document.querySelectorAll('[data-nav-dropdown].open').forEach(d=>{
      d.classList.remove('open');
      d.querySelector('.nav-dropdown-toggle')?.setAttribute('aria-expanded','false');
    });
  }
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  if(action === 'mobile-menu-toggle'){
    document.getElementById('site-nav')?.classList.toggle('nav-open');
    return;
  }
  if(action === 'logout'){
    await authService.logout();
    location.hash = '#/admin/login';
    return;
  }
  const resourceKey = btn.dataset.resource;
  const id = btn.dataset.id;
  if(action === 'delete'){
    if(!confirm('Delete this item? This cannot be undone.')) return;
    await resourceConfigs[resourceKey].service.delete(id);
    showToast('Deleted.');
    render();
  } else if(action === 'mark-contact-read'){
    await contactSubmissionService.update(id,{status:'read'});
    showToast('Message marked as read.');
    render();
  } else if(action === 'revoke-admin'){
    if(!confirm('Revoke this admin account?')) return;
    const me=await authService.currentUser();
    if(me?.role!=='super_admin') return;
    await adminUsersService.update(id,{status:'disabled'});
    showToast('Access revoked.');
    render();
  } else if(action === 'toggle-status'){
    const cfg = resourceConfigs[resourceKey];
    const statusKey = cfg.statusField || 'status';
    const item = await cfg.service.getById(id);
    const next = item[statusKey] === 'published' ? 'draft' : 'published';
    await cfg.service.update(id, { [statusKey]: next });
    showToast(next === 'published' ? 'Published.' : 'Unpublished.');
    render();
  }
});

function initHomeSymbolField(){
  const canvas=document.getElementById('home-symbol-canvas');
  if(!canvas) return;

  const ctx=canvas.getContext('2d');
  if(!ctx) return;

  let W=0,H=0,dpr=1,cells=[];

  const white=['·','.','+','=','*','-','%','#',':'];
  const red=['+','*','#','%','-'];

  function resize(){
    const rect=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(1,Math.floor(rect.width));
    H=Math.max(1,Math.floor(rect.height));

    canvas.width=Math.floor(W*dpr);
    canvas.height=Math.floor(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const cellW=13;
    const cellH=16;
    const cols=Math.ceil(W/cellW);
    const rows=Math.ceil(H/cellH);

    const copy=document.querySelector('.home-copy');
    let exclusion=null;

    if(copy){
      const c=copy.getBoundingClientRect();
      const cr=canvas.getBoundingClientRect();
      const padX=24;
      const padY=20;
      exclusion={
        left:c.left-cr.left-padX,
        right:c.right-cr.left+padX,
        top:c.top-cr.top-padY,
        bottom:c.bottom-cr.top+padY
      };
    }

    cells=[];

    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        const px=x*cellW+Math.random()*5;
        const py=y*cellH+Math.random()*5;
        if(exclusion &&
           px>=exclusion.left && px<=exclusion.right &&
           py>=exclusion.top && py<=exclusion.bottom){
          continue;
        }
        const edgeX=exclusion ? Math.min(Math.abs(px-exclusion.left),Math.abs(px-exclusion.right)) : 9999;
        const edgeY=exclusion ? Math.min(Math.abs(py-exclusion.top),Math.abs(py-exclusion.bottom)) : 9999;
        let density=.92;
        if(exclusion && (edgeX<45 || edgeY<45)) density=.70;

        if(Math.random()<density){
          const isRed=Math.random()<.028;
          cells.push({
            x:px,
            y:py,
            char:isRed
              ? red[Math.floor(Math.random()*red.length)]
              : white[Math.floor(Math.random()*white.length)],
            red:isRed,
            alpha:isRed ? .20+Math.random()*.08 : .22+Math.random()*.11
          });
        }
      }
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.font='11px "IBM Plex Mono",monospace';
    ctx.textBaseline='top';

    for(const c of cells){
      ctx.fillStyle=c.red
        ? `rgba(208,43,68,${c.alpha})`
        : `rgba(241,236,225,${c.alpha})`;
      ctx.fillText(c.char,c.x,c.y);
    }
  }

  resize();
  draw();

  window.addEventListener('resize',()=>{
    resize();
    draw();
  },{passive:true});
}

function initInlinePacketPanic(){
  const root=document.getElementById('packet-panic-game');
  if(!root) return;

  const list=root.querySelector('#packet-game-list');
  const submit=root.querySelector('#packet-submit');
  const reset=root.querySelector('#packet-reset');
  const feedback=root.querySelector('#packet-game-feedback');
  const threatCount=root.querySelector('#packet-threat-count');
  const chancesEl=root.querySelector('#packet-chances');
  const status=root.querySelector('#packet-game-status');
  const instruction=root.querySelector('#packet-game-instruction');
  const easyBtn=root.querySelector('#packet-easy');
  const hardBtn=root.querySelector('#packet-hard');

  if(!list || !submit || !reset || !easyBtn || !hardBtn) return;

  const protocols=['TLS','DNS','HTTP','TCP','HTTPS','SSH','FTP','API'];
  const packetCount=8;
  let packets=[];
  let chances=3;
  let locked=false;
  let mode='easy';

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function setMode(nextMode){
    if(nextMode===mode && packets.length) return;

    mode=nextMode;
    easyBtn.classList.toggle('active',mode==='easy');
    hardBtn.classList.toggle('active',mode==='hard');

    if(mode==='easy'){
      instruction.textContent='Easy mode: inspect packets one at a time. Click a packet and you\'ll immediately know whether you found a threat.';
      submit.style.display='none';
    }else{
      instruction.textContent='Hard mode: exactly 3 packets are threats. Select all 3 at once, then check your analysis. No packet reveals its status until you submit.';
      submit.style.display='';
      submit.textContent='CHECK 3 PACKETS';
    }

    newRound();
  }

  function newRound(){
    chances=3;
    locked=false;
    feedback.textContent='';
    feedback.className='packet-game-feedback mono';
    reset.textContent='NEW ROUND';
    const threatCountValue = mode==='hard'
      ? 3
      : 1 + Math.floor(Math.random()*3); // 1–3 threats in Easy

    const threatIndexes=new Set(
      shuffle([...Array(packetCount).keys()]).slice(0,threatCountValue)
    );

    packets=Array.from({length:packetCount},(_,i)=>({
      id:i+1,
      protocol:protocols[i],
      source:`10.0.${Math.floor(Math.random()*8)+1}.${Math.floor(Math.random()*220)+10}`,
      size:Math.floor(180+Math.random()*820),
      threat:threatIndexes.has(i),
      selected:false,
      checked:false
    }));

    threatCount.textContent=`THREATS: ${String(threatCountValue).padStart(2,'0')}`;
    chancesEl.textContent='CHANCES: 03';
    status.textContent=`${mode.toUpperCase()} // 3 CHANCES`;
    submit.disabled=false;

    render();
  }

  function render(reveal=false){
    list.innerHTML=packets.map(p=>{
      const easyCorrect=mode==='easy' && p.checked && p.threat;
      const easyWrong=mode==='easy' && p.checked && !p.threat;
      const hardSelected=mode==='hard' && p.selected;

      return `
        <button type="button"
          class="packet-game-row ${easyCorrect?'easy-correct':''} ${easyWrong?'easy-wrong':''} ${hardSelected?'hard-selected':''} ${reveal && p.threat?'reveal-threat':''} ${reveal && !p.threat?'reveal-safe':''}"
          data-packet="${p.id}"
          ${(locked || (mode==='easy' && p.checked))?'disabled':''}>
          <span><span class="packet-game-check"></span>PKT ${String(p.id).padStart(2,'0')}</span>
          <span>${p.source}</span>
          <span>${p.protocol}</span>
          <span>${p.size} B</span>
        </button>
      `;
    }).join('');

    if(!locked){
      list.querySelectorAll('.packet-game-row').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const packet=packets.find(p=>p.id===Number(btn.dataset.packet));
          if(!packet) return;

          if(mode==='easy'){
            checkEasyPacket(packet);
          }else{
            packet.selected=!packet.selected;
            render();
            updateHardSelectionFeedback();
          }
        });
      });
    }
  }

  function checkEasyPacket(packet){
    if(locked || packet.checked) return;

    packet.checked=true;

    if(packet.threat){
      feedback.textContent=`CORRECT // PKT ${String(packet.id).padStart(2,'0')} IS A THREAT`;
      feedback.className='packet-game-feedback mono good';

      const remainingThreats=packets.filter(p=>p.threat && !p.checked).length;

      if(remainingThreats===0){
        locked=true;
        render(true);
        feedback.textContent=`ROUND CLEARED // ALL ${packets.filter(p=>p.threat).length} THREATS FOUND`;
        feedback.className='packet-game-feedback mono good';
        status.textContent='EASY // ROUND CLEARED';
        reset.textContent='PLAY AGAIN';
      }else{
        status.textContent=`EASY // ${remainingThreats} THREAT${remainingThreats===1?'':'S'} LEFT`;
        render();
      }
    }else{
      chances--;
      chancesEl.textContent=`CHANCES: ${String(chances).padStart(2,'0')}`;
      feedback.textContent=`INCORRECT // PKT ${String(packet.id).padStart(2,'0')} IS SAFE`;
      feedback.className='packet-game-feedback mono bad';

      if(chances<=0){
        locked=true;
        render(true);
        const actual=packets.filter(p=>p.threat).map(p=>`PKT ${String(p.id).padStart(2,'0')}`).join(', ');
        feedback.textContent=`ROUND FAILED // THREATS WERE ${actual}`;
        feedback.className='packet-game-feedback mono bad';
        status.textContent='EASY // ROUND FAILED';
        reset.textContent='TRY AGAIN';
      }else{
        status.textContent=`EASY // ${chances} CHANCE${chances===1?'':'S'} LEFT`;
        render();
      }
    }
  }

  function updateHardSelectionFeedback(){
    const selectedCount=packets.filter(p=>p.selected).length;
    if(selectedCount===3){
      feedback.textContent='3 PACKETS SELECTED // CHECK YOUR ANALYSIS';
      feedback.className='packet-game-feedback mono';
    }else{
      feedback.textContent=`SELECT ALL 3 THREATS // ${selectedCount}/3 SELECTED`;
      feedback.className='packet-game-feedback mono';
    }
  }

  function submitHardAnalysis(){
    if(locked || mode!=='hard') return;

    const guessed=packets.filter(p=>p.selected).map(p=>p.id).sort((a,b)=>a-b);
    const actual=packets.filter(p=>p.threat).map(p=>p.id).sort((a,b)=>a-b);

    if(guessed.length!==3){
      feedback.textContent=`SELECT EXACTLY 3 PACKETS // ${guessed.length}/3 SELECTED`;
      feedback.className='packet-game-feedback mono bad';
      return;
    }

    const correct=guessed.length===actual.length &&
      guessed.every((v,i)=>v===actual[i]);

    if(correct){
      locked=true;
      render(true);
      feedback.textContent='HARD MODE CLEARED // ALL 3 THREATS FOUND AT ONCE';
      feedback.className='packet-game-feedback mono good';
      status.textContent='HARD // ROUND CLEARED';
      submit.disabled=true;
      reset.textContent='PLAY AGAIN';
      return;
    }

    chances--;
    chancesEl.textContent=`CHANCES: ${String(chances).padStart(2,'0')}`;

    if(chances<=0){
      locked=true;
      render(true);
      feedback.textContent=`ANALYSIS FAILED // THREATS WERE ${actual.map(n=>`PKT ${String(n).padStart(2,'0')}`).join(', ')}`;
      feedback.className='packet-game-feedback mono bad';
      status.textContent='HARD // ROUND FAILED';
      submit.disabled=true;
      reset.textContent='TRY AGAIN';
    }else{
      feedback.textContent=`INCORRECT // ${chances} CHANCE${chances===1?'':'S'} REMAIN`;
      feedback.className='packet-game-feedback mono bad';
      status.textContent=`HARD // ${chances} CHANCE${chances===1?'':'S'} LEFT`;
      packets.forEach(p=>p.selected=false);
      render();
    }
  }

  easyBtn.addEventListener('click',()=>setMode('easy'));
  hardBtn.addEventListener('click',()=>setMode('hard'));
  submit.addEventListener('click',submitHardAnalysis);
  reset.addEventListener('click',newRound);

  submit.style.display='none';
  newRound();
}
